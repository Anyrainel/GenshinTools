- id: vesna-default-pinion-count
  entity: vesna
  rule: U9
  status: completed
  category: bug
  summary: >
    The default rotation counts one full N6 chain and only five Wind Pinions,
    which is internally inconsistent and cannot fund all five Windborne Sword
    casts from the opener plus a mid-rotation Burst.
  detail: >
    Added a distinct vesna-normal-1 formula while keeping vesna-normal as the
    full N6 action for existing saved combos. Default is four N1C chains and
    twelve pinions, funding five swords together with E's two Essence and Q's
    one. C1 adds one free Lv3 cast. Q is now modeled before Lv3, following
    Prydwen's E N1C E N1C E Q E N1C E N1C E rotation. P1 uses two prior-cast
    stacks for Q and a Lv3 average of four at C0, 4.5 at C1, six at C2+.
    C6 uses one N1C and three regular pinions; Transpose supplies the other nine.
    Formula IDs keep their existing combat-action units; no schema change.
    https://meropide.cn/chs/characters/薇斯纳/theorycraft/
    https://www.prydwen.gg/genshin-impact/characters/vesna

