- id: vesna-p1-cast-stack-timing
  entity: vesna
  rule: U9
  status: open
  category: needs-data
  summary: >
    P1 assumes each sword and Burst hit benefits only from stacks gained by
    previous casts. The talent grants a stack on using the ability, so the
    delayed Spirit Blade hits may already benefit from that same cast's stack.
  detail: >
    The model retains previous-cast timing, modeling Lv2 at one stack and a
    Burst after Lv2 at two. The code now labels this as an approximation. Confirm
    the stack event relative to blade damage with gameplay or ability configs.
    For an E, Lv1, Lv2, Q, Lv3 x3 default, same-cast gain means Lv2 uses two
    stacks, Q three, Lv3 four/five/six (mean five); previous-cast gain means
    Lv2 one, Q two, Lv3 three/four/five (mean four). C2 always uses six.
    KQM TCL currently lacks tested findings for Vesna; neither its talent text
    nor Meropide's research specifies this event ordering.
    Prydwen's original Vesna guide (updated September 27, 2026) explicitly says
    that Burst after the second sword benefits from two P1 stacks, supporting
    the existing previous-cast treatment for Burst. Retain that treatment
    unless direct event-order evidence establishes otherwise; the unresolved
    question is whether delayed sword blades use the same timing as Burst.
    https://library.keqingmains.com/characters/anemo/vesna
    https://www.prydwen.gg/genshin-impact/characters/vesna
