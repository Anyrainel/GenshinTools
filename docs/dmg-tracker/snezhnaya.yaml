# Snezhnaya Damage Tracker

- id: "arlecchino-e-spike-missing"
  entity: "arlecchino"
  rule: "S8"
  status: wont-do
  category: "missing-formula"
  summary: "E Spike DMG ({param1}) is not included as a part in the E formula. The spike hits multiple opponents on E cast alongside the cleave — per S8 it should be an extra part in the existing arlecchino-e-cleave entry."
  detail: >
    E Spike DMG is 26.7% ATK at Lv10 vs Cleave at 240.4% — about 11% of the cleave. In
    Arlecchino's Normal Attack-heavy rotation (3 full NA sequences at ~1500%+ ATK each,
    plus Q and E cleave), the spike adds ~26.7% to a single E cast, contributing well
    under 2% of total rotation DPS. Negligible impact; not worth modeling.

- id: "arlecchino-directive-periodic"
  entity: "arlecchino"
  rule: "S8"
  status: wont-do
  category: "missing-formula"
  summary: "Blood-Debt Directive periodic DMG ({param3}, every 5s, max 2 instances, ability: skill, offField: true) has no formula. Per S8, periodic/proc damage should always be modeled."
  detail: >
    Blood-Debt Directive deals 57.2% ATK per tick (Lv10), every 5s, max 2 instances =
    114.4% ATK total. Arlecchino's rotation is dominated by Masque of the Red Death
    Normal Attacks (~4500%+ ATK equivalent per rotation with Bond of Life scaling) plus
    Q and C2 Bloodfire. The directive's 114.4% contributes ~2% of total rotation DPS.
    Negligible impact; not worth adding a formula for.

- id: "arlecchino-normal-bol-repeat"
  entity: "arlecchino"
  rule: "U9"
  status: actionable
  category: "approximation"
  summary: >
    The default combo repeats arlecchino-normal three times, but that formula's Masque
    of the Red Death bonus always starts from the selected initial Bond of Life. Later
    Normal Attack sequences should continue from the lower Bond of Life left after the
    previous hits consumed 7.5% current Bond of Life each.
  detail: >
    Current formula parts use hitIndex 0-6 and comboDescriptor count: 3, so each repeated
    sequence reuses the same BoL values. Model the rotation with separate normal formula
    entries or another per-rotation hit-index mechanism so hits 8-21 use continued
    0.925^n decay instead of resetting after each 7-hit sequence.

- id: "tartaglia-c4-riptide-count"
  entity: "tartaglia"
  rule: "S9"
  status: actionable
  category: "approximation"
  summary: >
    C4 Riptide count is still approximated incorrectly. The current comboDescriptor adds
    six extra Riptide Slash hits over a ~9s melee rotation even though C4 can only trigger
    once every 4s, and the ranged Riptide Flash path has no formula/rotation
    representation.
  detail: >
    Current code uses bonus:[{ minC: 4, delta: 6 }] for tartaglia-riptide-slash. Over the
    documented ~9s melee window, the every-4s C4 cadence should add about 2 extra melee
    slashes, or at most 3 if assuming immediate timer alignment, not another full set of
    six base 1.5s procs. If modeling the ranged C4 branch, add a Riptide Flash formula
    from A param9 with hits: 3, Hydro/normal/none, then decide its combo count separately
    from the melee stance rotation.
