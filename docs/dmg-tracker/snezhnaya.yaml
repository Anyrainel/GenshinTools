# Snezhnaya Damage Tracker
- id: tartaglia-p3-party-level
  entity: tartaglia
  rule: S6
  status: wont-do
  category: approximation
  summary: >
    P3 +1 Normal Attack talent level for all party members not modeled.
    Effect is unconditional but engine lacks talent-level adjustment.
  detail: >
    P3 "Master of Weaponry" grants +1 Normal Attack Level to all party members
    (unconditional, no team comp requirement). Engine cannot model this because
    talent multipliers are hardcoded constants in each character's formulaMap.
    A +1 talent level maps to different percentage increases per character
    (~5-7% at Lv10->11), so no single baseDmg% team buff can accurately
    represent it. Would require a talent-level-aware formula system or
    per-character multiplier lookup tables. Impact is moderate (~5% Normal ATK
    increase) but universal across all party members.
  created: "2026-02-25"
  resolved: "2026-02-25"
- id: arlecchino-excel-bol-zone
  entity: arlecchino
  rule: S2
  status: completed
  category: needs-data
  summary: >
    Excel places Bond of Life bonus damage inside the talentMult zone
    (multiplied with multZone), while TS places it in the flat baseDmg zone
    (additive). Verify which zone placement matches the game's actual behavior.
  detail: >
    Excel source: docs/formulas/原神伤害计算(1).xlsm (VBA module: A火元素角色模块1.bas).
    Excel formula: (atk * ((talentMult + hongsizhiyan * BoL) * normalMultZone) + normalBaseZone).
    TS implementation: BoL bonus is added as flat baseDmg via extraTerm, not multiplied with multZone.
    Game text uses "提升值相当于" which may suggest flat additive (matching TS), but the distinction
    affects how倍率区 buffs interact with BoL damage. Needs in-game testing to confirm.
  note: >
    Zone naming difference only. Will be refactored to per-hit baseDmg% bespokeBuff in future.
  created: "2026-03-22"
  resolved: "2026-03-22"
