- id: finale-deep-galleries-exclusion
  entity: finale_of_the_deep_galleries
  rule: S6
  status: wont-do
  category: approximation
  summary: >
    4pc Normal ATK +60% and Burst +60% buffs mutually exclude in game (each disables
    the other for 6s after its hit) and require 0 energy. Implementation applies
    both simultaneously and unconditionally, over-estimating for rotations that use
    both ability types.
  detail: >
    This set is mostly used by Skirk, whose skill kit works around those 6s cooldowns
    effectively. So implementing any lower approximation is likely bad for Skirk. For
    other characters, it is not necessary to optimize for correctness as user can tune
    the partial buff applications manually.
