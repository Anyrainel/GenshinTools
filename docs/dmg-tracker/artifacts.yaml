- id: finale-deep-galleries-exclusion
  entity: finale_of_the_deep_galleries
  rule: S6
  status: wont-do
  category: approximation
  summary: >
    4pc Normal ATK +60% and Burst +60% buffs mutually exclude in game (each disables
    the other for 6s after its hit) and require 0 energy. Implementation applies
    both simultaneously and unconditionally, over-estimating for rotations that use
    both ability types.
  detail: >
    This set is mostly used by Skirk, whose skill kit works around those 6s cooldowns
    effectively. So implementing any lower approximation is likely bad for Skirk. For
    other characters, it is not necessary to optimize for correctness as user can tune
    the partial buff applications manually.

- id: thundering-fury-stellar-conduct
  entity: thundering_fury
  rule: U3
  status: completed
  category: bug
  summary: >
    4pc is missing the Stellar-Conduct clause. The 7.0 text reads
    "月感电、星超导反应造成的伤害提升20%", but the implementation's 20% buff filters on
    reactions ["aggravate", "lunarCharged"] only, so Stellar-Conduct dealers wearing
    Thundering Fury lose a +20% reactionDmg% bonus the game grants.
  detail: >
    Added "stellarConduct" to the second StatBuff's reactions filter in
    ThunderingFury4pc (src/domain/combat/damage/impl/artifact4pc.ts), which now reads
    ["aggravate", "lunarCharged", "stellarConduct"] at the same +20% reactionDmg%
    value. The 40% clause was left untouched, and the class comment was updated to
    name the Stellar-Conduct clause. Fixes the U12 stellar-supersede gap where an
    Electro dealer on a Sandrone team received nothing from either reaction clause,
    since hasReaction("superconduct") is false there. type-check PASS; dmgcalc and
    team-comp suites pass.

- id: heart-of-furnace-trigger-label
  entity: heart_of_the_furnace
  rule: U7
  status: completed
  category: bug
  summary: >
    4pc buffs are labelled triggers: ["on-reaction"], but the game text scopes them to
    星烁 (Stellar Glimmer), an umbrella reaction term. U7 requires "stellar-reaction"
    for an umbrella stellar clause; the generic label flattens the scoping, so the
    displayed condition reads as "any reaction". The self ATK +12% buff carries no
    reactions filter at all, so the trigger label is its only scope carrier.
  detail: >
    Both StatBuffs in HeartOfTheFurnace4pc (src/domain/combat/damage/impl/artifact4pc.ts
    ~L1530-L1551). "stellar-reaction" already exists in the codebase (weapon4Sword.ts,
    weapon4Catalyst.ts, weapon4Claymore.ts, weapon4Polearm.ts), and the same file
    already uses the umbrella label "lunar-reaction" for the Gleaming Moon set
    (~L1158/L1176), so this is a straight label swap with existing precedent.
    Display-only; no damage change.

    RESOLVED: both 4pc buffs relabelled ["on-reaction"] -> ["stellar-reaction"],
    the umbrella label matching 星烁. Same convention applied to the weapons the
    same day; the self ATK buff carries no reactions filter, so the trigger label
    is its only scope carrier.

- id: scarlet-proof-trigger-label
  entity: scarlet_proof
  rule: U7
  status: completed
  category: bug
  summary: >
    4pc buffs are labelled triggers: ["on-reaction"], but the game text names one
    specific reaction ("装备者触发星扩散反应后"). U7's trigger-label table maps a
    specific named reaction to its ReactionType value, i.e. "stellarSwirl". The
    CRIT Rate +16% buff has no reactions filter, so the generic label is the only
    place its 星扩散-only scoping could be shown, and it currently reads as "any
    reaction".
  detail: >
    Both StatBuffs in ScarletProof4pc (src/domain/combat/damage/impl/artifact4pc.ts
    ~L1569-L1586). Precedent in the same file: DisenchantmentInDeepShadow4pc's
    unfiltered CRIT Rate buff uses triggers ["vs-superconduct", "vs-stellarConduct"]
    rather than "on-reaction". Display-only; no damage change. The reactions filter
    on the +40% reactionDmg% clause is already correct (星扩散 only, no sibling).

    RESOLVED: both 4pc buffs relabelled ["on-reaction"] -> ["stellarSwirl"], the
    specific label matching 星扩散 (not the 星烁 umbrella). The CRIT Rate buff
    carries no reactions filter, so the label is its only scope carrier.

- id: celestial-gift-active-element-sharing
  entity: celestial_gift
  rule: U1
  status: open
  category: approximation
  summary: >
    Default conservative mode gives Mortal Hymn's additional active-character-element bonus only to otherOnField. Source grants that element bonus to all nearby party members, so same-element off-field teammates miss it.
  detail: >
    Source artifact_zh.json celestial_gift.effect4. artifact4pc.ts CelestialGift4pc L1412: self mode chooses otherOnField for non-wearer elements; team mode grants every represented team element to all recipients. Options bracket the effect but neither tracks which element was actually on field during application. Preserve an explicit approximation until active-element application is modeled.

- id: artifact-15049-cr-budget-element-scope
  entity: artifact_15049
  rule: U5
  status: completed
  category: bug
  summary: >
    Account CR budgeting returns no artifact_15049 CR for every non-Cryo wearer,
    although its bonus depends on the damage element rather than the wearer's
    element. Anemo Stellar Swirl contributors can receive the full 40% on their
    Cryo Vortex damage, and non-Cryo melee wearers can receive 20% on Cryo-infused
    attacks, so their artifact recommendations currently omit reachable CR.
  detail: >
    Live 7.2.50 ZH 15049: "造成的冰元素伤害的暴击率提升20%，若该伤害为星烁反应伤害，则暴击率额外提升20%".
    maxCrBuff.ts getDynamicArtifactBuff instead requires the wearer's stats.element
    to be Cryo. Verified through a read-only TeamBuild runtime probe: C0 Sucrose
    wearing the set with C0 Odette has an own statsCharId=sucrose Cryo/special/
    stellarSwirl Vortex contribution; compared with no set, it gains 0.20 cr and
    0.20 reactionCr, but getCrBudget reports artifactSetCr=0. A second probe using
    C0 Razor plus C0 Chongyun with infusion:razor=chongyun produces a Cryo/normal/
    none attack with 0.25 CR (base 0.05 plus set 0.20), while its artifact CR budget
    is also zero. Existing tests cover only native Cryo/other-element negatives
    and therefore assert the overly narrow vision-based assumption.

    TRIAGE: Actionable. The source qualifies the wearer's damage, not their native
    element. Preserve the account budget's team-independent reachable-single-hit
    ceiling: include 20% when the wearer can deal their own Cryo damage and 40%
    when a reachable own Cryo hit is classified as either Stellar reaction. A
    possible teammate may supply infusion or enable the Stellar path; requiring
    the actual current team would change the established budget policy. Regression
    coverage must include Sucrose's own Cryo Stellar Swirl Vortex contribution
    (40%), Razor's Chongyun-infused ordinary Cryo normal (at least 20%), native
    Cryo damage, and an actually unreachable own-Cryo case. Determine the maximum
    over each wearer's reachable damage paths; the infusion example alone does
    not establish that 20% is Razor's absolute maximum. Keep ordinary non-Cryo
    and non-Stellar damage from inheriting the reaction-specific increment, and
    do not count a teammate-owned Cryo hit as the wearer's damage.

    RESOLVED: Account budgeting now uses the loaded damage-capability metadata:
    Cryo/Anemo wearers can own Cryo Stellar Swirl Vortex damage and receive a
    40% reachable ceiling; other Sword/Claymore/Polearm wearers can use external
    Cryo infusion and receive 20%; remaining wearers receive zero. No combat
    engine import or Radiance whitelist was introduced into the account helper.
    Actual TeamBuild comparisons cover Sucrose and Kaeya's own positive-damage
    Vortex contributions, Razor's Chongyun-infused normal damage, and Fischl's
    lack of own Cryo damage despite Cryo teammates and a selected infusion.
    The comparisons exclude zero-damage Stellar-Conduct field procs and verify
    ordinary Cryo stays at 20%, non-Cryo Stellar damage gets no increment, and
    teammates do not inherit the wearer's set CR. All 43 maxCrBuff tests and
    npm run type-check pass.
