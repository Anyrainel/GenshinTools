- id: durin-kqm-dragon-tick-count
  entity: durin
  rule: S8
  status: completed
  category: needs-data
  summary: >
    Dragon tick count may be underestimated. Implementation models 10 ticks for
    both White Flame and Dark Decay, but KQM documents tick intervals of 1s
    (White) and 1.25s (Dark) over 20s duration, suggesting 20 and 16 total ticks
    respectively.
  detail: >
    Updated dragon tick counts: White Flame 10→20, Dark Decay 10→16. Moved P2
    buff (Primordial Fusion, 10 stacks) from global buffs array to bespokeBuff
    on the first 10 dragon tick hits, with remaining ticks (10 White, 6 Dark)
    as unbuffed parts.
  created: "2026-03-22"
  resolved: "2026-03-22"

- id: durin-kqm-c4-stack-preservation
  entity: durin
  rule: S5
  status: completed
  category: approximation
  summary: >
    C4 30% chance to not consume Cycle of Enlightenment stacks (from C1) is not
    modeled. This effectively increases the number of buffed hits by ~43%
    (from 20 to ~28.6 expected triggers for White, 10 to ~14.3 for Dark).
  detail: >
    Added two C4-gated option choices ("C4 White unlimited", "C4 Dark 14 stacks").
