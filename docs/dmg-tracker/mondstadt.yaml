# Mondstadt Damage Tracker

- id: mona-c6-ramp-hardcoded
  entity: mona
  rule: S12
  status: wont-do
  category: approximation
  summary: >
    C6 Charged Attack DMG ramp (+60%/s up to +180% over 3s) is hardcoded to
    maximum value 1.8 without OptionMap tiers. The ramp takes 3s to reach max,
    qualifying for S12 tier selection. Mona has no existing OptionMap so one
    could be added for C6 users.
  detail: >
    Mona C6 ramp is action-gated, not time-gated in the S12 sense: the player
    enters Illusory Torrent (sprint), waits until the buff reaches max, then fires
    the charged attack. Unlike Furina fanfare or Xiao burst decay where you deal
    damage during the ramp, Mona C6 users intentionally delay the charged attack
    until the buff is full. Hardcoding max is consistent with the S6 peak-damage
    model for trivially-met conditions. Additionally, C6 Mona is an extremely
    niche scenario with negligible user impact.

- id: sucrose-q-absorption-additional-dmg
  entity: sucrose
  rule: S7
  status: wont-do
  category: engine-gap
  summary: >
    Q Additional Elemental DMG from Elemental Absorption is not modeled. The
    current `sucrose-burst` formula only covers the Anemo DoT, while game text
    adds a separate Hydro/Pyro/Cryo/Electro damage component after absorption.
  detail: >
    Element absorption formulas cannot be selected from team composition alone.
    The absorbed element depends on in-game aura priority and enemy state, so a
    default team-element choice would be wrong when multiple absorbable elements
    are present. Leave this unmodeled until explicit absorption selection exists.

- id: sucrose-q-dot-hit-count
  entity: sucrose
  rule: S7
  status: open
  category: needs-data
  summary: >
    Q continuous Anemo DoT is modeled as a single hit. Game text describes
    continuous Anemo damage over the burst duration, so the formula needs a
    verified hit count, including the C2 duration extension.
  detail: >
    Keep open. The tracker claim is credible, but the exact continuous Anemo hit
    count and the C2 duration-extension count need frame or rotation data before
    the formula count can be changed safely.

- id: albedo-c4-silver-plunge-buff
  entity: albedo
  rule: U8
  status: wont-do
  category: engine-gap
  summary: >
    C4's Silver Isotoma jump buff is not modeled. The implementation covers the
    Solar Isotoma field's +30% Plunging Attack DMG, but not the separate Silver
    Isotoma effect that grants +30% Plunging Attack ground impact DMG for 3s.
  detail: >
    Current damage tags can scope to Plunging Attack damage, but cannot
    distinguish the ground-impact portion from plunge collision damage. Modeling
    C4 as a generic plunge buff would over-apply the effect, so the current
    omission is acceptable.

- id: klee-burst-offfield-flag
  entity: klee
  rule: S11
  status: actionable
  category: bug
  summary: >
    Q Sparks 'n' Splash is marked `offField: true`, but Klee's burst damage only
    persists while Klee remains on-field. The off-field flag incorrectly excludes
    on-field buffs from her burst damage.
  detail: >
    Sparks 'n' Splash only continues while Klee remains on-field, so its burst
    damage should be treated as on-field damage and should receive on-field buffs.

- id: klee-burst-hit-count
  entity: klee
  rule: S7
  status: open
  category: needs-data
  summary: >
    Q Sparks 'n' Splash is modeled as a single hit. Game text describes
    continuous attacks throughout the burst duration, so the formula needs a
    verified hit count.
  detail: >
    Keep open. The continuous burst attack is significant enough to model, but
    the correct default hit count needs gameplay or frame data rather than a
    guessed duration divisor.

- id: klee-missing-normal-formula
  entity: klee
  rule: S7
  status: actionable
  category: missing-formula
  summary: >
    Klee has no Normal Attack formula even though her Hexerei passive and C6 add
    Boom-Boom Strike follow-up attacks from Normal Attack hits during her burst.
    Missing NA coverage prevents those kit-signaled follow-ups from being modeled.
  detail: >
    Klee is a catalyst DPS and her Normal Attack sequence is a meaningful damage
    source. Add normal attack coverage so Normal-triggered follow-up effects such
    as Hexerei/Boom-Boom Strike and C6 can be evaluated against real attack hits.
