    Revisit once in-game frame data is published.

- id: albedo-c4-silver-plunge-buff
  entity: albedo
  rule: U8
  status: wont-do
  category: engine-gap
  summary: >
    C4's Silver Isotoma jump buff is not modeled. The implementation covers the
    Solar Isotoma field's +30% Plunging Attack DMG, but not the separate Silver
    Isotoma effect that grants +30% Plunging Attack ground impact DMG for 3s.
  detail: >
    Current damage tags can scope to Plunging Attack damage, but cannot
    distinguish the ground-impact portion from plunge collision damage. Modeling
    C4 as a generic plunge buff would over-apply the effect, so the current
    omission is acceptable.

- id: klee-burst-offfield-flag
