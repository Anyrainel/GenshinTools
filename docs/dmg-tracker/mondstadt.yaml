# Mondstadt Damage Tracker

- id: albedo-p1-enemy-hp-combatopt
  entity: albedo
  rule: S6
  status: wont-do
  category: approximation
  summary: >
    P1 Transient Blossom +25% DMG vs enemies HP <50% is modeled as always-active.
    Per rule S6, enemy HP conditions should use CombatOpts. Low priority since Albedo
    is typically not the damage focus character.
  detail: >
    Approximation is within acceptable range. Albedo is a support character whose
    Transient Blossom is not the team's primary damage source. The +25% dmg% only
    applies to his E skill hits (already scoped with ability filter). In practice,
    enemies spend a significant portion of the fight below 50% HP. The always-on
    model overestimates by roughly 12.5pp in the dmg% zone, which is a small
    fraction of total team DPS. Not worth adding a CombatOpt for a support's
    off-field proc.
  created: "2026-02-26"
  resolved: "2026-02-26"

- id: razor-c2-enemy-hp-combatopt
  entity: razor
  rule: S6
  status: wont-do
  category: approximation
  summary: >
    C2 CRIT Rate +10% vs enemies <30% HP is not modeled. Per rule S6, enemy HP
    conditions should use CombatOpts. Currently omitted entirely.
  detail: >
    Approximation is within acceptable range. The +10% CR only applies during the
    execute phase (enemy below 30% HP), which is a small fraction of total fight
    duration. Expected DPS contribution is well under 5%. Razor is a 4-star
    physical carry whose optimization is not highly sensitive to this minor
    conditional CR bonus. Omitting entirely (conservative, underestimates) is
    preferable to always-on (overestimates) and not worth a CombatOpt.
  created: "2026-02-26"
  resolved: "2026-02-26"

- id: razor-p4-hexerei-lightning
  entity: razor
  rule: S8
  status: wont-do
  category: missing-formula
  summary: >
    P4 Hexerei: Secret Rite lightning strike (150% ATK Electro AoE, once per 1s
    when sigils overflow during Q) is not modeled. Potentially significant damage
    source over 15s Q duration, especially at C6 where every E triggers overflow.
  detail: >
    Periodic/minor proc, estimated <5% DPS contribution. Not in DmgRunbook.
    Only active with >=2 Hexerei teammates (niche comp). Over 15s Q, realistically
    2-3 E presses trigger overflow = 300-450% ATK total. Compare to Q Normal Combo
    total of ~1124% ATK equivalent per rotation (physical + wolf). Not worth
    modeling for a niche conditional proc on a 4-star character.
  created: "2026-02-26"
  resolved: "2026-03-14"

- id: mona-c1-offfield-enhancement
  entity: mona
  rule: S6
  status: wont-do
  category: approximation
  summary: >
    C1 off-field party members get 160% of the reaction DMG bonus (24% instead
    of 15%), but the implementation uses a flat 15% for all team members.
  detail: >
    Approximation is within acceptable range. The delta is 9pp reactionDmg%
    (24% vs 15%) for off-field party members only. In Mona teams, the calcTarget
    (optimization target) is typically the on-field DPS who correctly receives
    15%. Off-field characters' reaction damage is not being optimized and
    contributes minimally to total team DPS. No existing receiver type cleanly
    models "other off-field party members" for differential bonus, and the
    accuracy impact on the optimization target is zero. Not worth the
    complexity.
  created: "2026-03-08"
  resolved: "2026-03-08"

