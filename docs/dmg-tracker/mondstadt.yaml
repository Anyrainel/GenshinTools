- id: klee-missing-normal-formula
  entity: klee
  rule: S7
  status: completed
  category: missing-formula
  summary: >
    Klee has no Normal Attack formula even though her Hexerei passive and C6 add
    Boom-Boom Strike follow-up attacks from Normal Attack hits during her burst.
    Missing NA coverage prevents those kit-signaled follow-ups from being modeled.
  detail: >
    Added a "klee-normal" formula with three parts (A param1/2/3) per S3, Pyro
    element (catalyst user, S10 exception #1), ability "normal". Provides a target
    for Normal-triggered follow-ups. Left out of the default comboDescriptor,
    which stays Charged-Attack-focused (N1C/N2C playstyle); the formula is
    selectable in the UI.

- id: lohen-special-e-wrong-param
  entity: lohen
  rule: S5
  status: completed
  category: bug
  summary: >
    The special Elemental Skill formula "lohen-e-special" (Etched Into Bone and
    Soul) uses this.param("E", 11), which is the High Plunge multiplier (316% at
    L10), instead of param17, the actual Etched Into Bone and Soul DMG (108% at
    L10). This is Lohen's primary damage source and is computed off the wrong
    talent row.
  detail: >
    Changed the lohen-e-special multiplier from this.param("E", 11) to
    this.param("E", 17) (Etched Into Bone and Soul DMG, 108%×4 at L10). hits: 4
    and Cryo/skill tag preserved. Added a code comment.

- id: lohen-will-perpoint-hardcoded
  entity: lohen
  rule: S5
  status: completed
  category: bug
  summary: >
    The Will to Win per-point DMG coefficient is hardcoded as 0.004 in willBoost,
    but it is a talent-level-dependent value (E param18 and Q param2, both shown
    as {paramN:F2P}/Point). It must use this.param() so it scales with talent
    level, and E vs Q use different param rows.
  detail: >
    Split the single willBoost buff into two per-ability baseDmg% buffs:
    this.param("E", 18) * willStacks scoped to abilities ["skill"] (the special E
    is the only skill-tagged E formula), and this.param("Q", 2) * willStacks
    scoped to abilities ["burst"]. Removes the hardcoded 0.004 so both scale with
    talent level.

- id: lohen-plunge-wrong-param
  entity: lohen
  rule: S5
  status: completed
  category: bug
  summary: >
    The optional plunge formula "lohen-e-plunge" uses this.param("E", 8) (Charged
    Attack Stamina Cost = 10) and this.param("E", 10) (Low Plunge). param8 is a
    stamina value, not a damage multiplier, producing nonsensical damage.
  detail: >
    Changed the falling-part multiplier from this.param("E", 8) (stamina cost) to
    this.param("E", 9) (Plunge DMG, 126.4% at L10); kept this.param("E", 10) (Low
    Plunge, 253% at L10) for the impact. Cryo/plunge tag preserved. Added a code
