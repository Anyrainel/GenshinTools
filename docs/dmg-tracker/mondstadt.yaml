# Mondstadt Damage Tracker

- id: mona-c6-ramp-hardcoded
  entity: mona
  rule: S12
  status: wont-do
  category: approximation
  summary: >
    C6 Charged Attack DMG ramp (+60%/s up to +180% over 3s) is hardcoded to
    maximum value 1.8 without OptionMap tiers. The ramp takes 3s to reach max,
    qualifying for S12 tier selection. Mona has no existing OptionMap so one
    could be added for C6 users.
  detail: >
    Mona C6 ramp is action-gated, not time-gated in the S12 sense: the player
    enters Illusory Torrent (sprint), waits until the buff reaches max, then fires
    the charged attack. Unlike Furina fanfare or Xiao burst decay where you deal
    damage during the ramp, Mona C6 users intentionally delay the charged attack
    until the buff is full. Hardcoding max is consistent with the S6 peak-damage
    model for trivially-met conditions. Additionally, C6 Mona is an extremely
    niche scenario with negligible user impact.

- id: sucrose-p1-element-restriction
  entity: sucrose
  rule: U1
  status: completed
  category: bug
  summary: >
    P1 Catalyst Conversion buff grants +50 EM to all non-Sucrose teammates via
    receiver "other" without filtering by element. Game text restricts the buff
    to teammates whose element matches the swirled element ("队伍中所有对应元素
    类型的角色"). Non-matching teammates incorrectly receive the buff.
  detail: >
    Replaced the single receiver:"other" StatBuff with a per-charId loop over
    teammates, emitting +50 EM only to teammates whose element is in the
    presentAbsorbElements set (the swirlable elements actually present on the team).

- id: albedo-c6-fatal-blossom-only
  entity: albedo
  rule: U5
  status: completed
  category: bug
  summary: >
    C6 +250% DEF baseDmg buff (after Silver Isotoma destroyed by Q) uses
    `filter: { abilities: ["burst"] }`, applying to both burst initial slash AND
    Fatal Blossoms. Game text restricts the boost to Fatal Blossoms only ("生灭
    之花造成的伤害").
  detail: >
    Removed the global ability-filtered C6 buff from buffs[]; moved it to a
    bespokeBuffs ScalingBuff on the Fatal Blossom part of albedo-burst, gated on
    Hexerei. The C2 buff is unchanged.

- id: diluc-missing-normal-formula
  entity: diluc
  rule: S8
  status: completed
  category: missing-formula
  summary: >
    Diluc has no Normal Attack formula despite NAs being part of his canonical
    rotation (N1E×3) and his C6 specifically buffing the next 2 Normal Attacks
    (DMG +30%, ATK SPD +30%). Missing NA formula reduces accuracy especially
    for C6 builds and undercounts vape rotations that include NAs.
  detail: >
    Added single-part diluc-normal formula (DirectFormula on A param1, Pyro/normal/none)
    representing the N1 cancel used in the N1E×3 string. comboDescriptor sets
    count=3 to reflect three N1 hits per rotation.

- id: venti-windsunder-requires-hexerei
  entity: venti
  rule: S6
  status: completed
  category: bug
  summary: >
    `venti-windsunder` formula models Hexerei: Secret Rite Windsunder Arrow
    (Anemo NA conversion using A param12). The formula always fires in combo
    regardless of Hexerei active. Non-Hexerei Venti would fire normal physical
    bow shots, not Windsunder Arrows — current modeling over-counts Anemo
    damage for non-Hexerei teams.
  detail: >
    Added when: this.teamMeta.countByFaction("Hexerei") >= 2 to the
    venti-windsunder FormulaEntry so it only fires when Hexerei: Secret Rite is
    active.

- id: venti-q-absorption-additional-dmg
  entity: venti
  rule: S10
  status: completed
  category: engine-gap
  summary: >
    Q Stormeye Additional Elemental DMG (param2, fires per tick when an element
    is absorbed) is not modeled. Per S10 element-absorption-formulas, the
    absorbed element depends on in-game aura priority and cannot be determined
    from team composition alone. Currently only the Anemo DoT (param1) is modeled,
    missing the absorbed-element companion damage.
  detail: >
    Added per-element venti-burst-absorb-{pyro|hydro|cryo|electro} formula entries
    for each absorbable element present in the team (param2, 20 hits, offField=true,
    burst-ability tag). Default count=0 in comboDescriptor since only one
    absorption can occur per cast — user opts in to the element they expect to be
    absorbed.
