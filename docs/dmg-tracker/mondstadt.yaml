    traditional shielder, the buff incorrectly deactivates even though
    Moondrifts satisfy the "阳华领域中存在月笼" condition.
  detail: >
    Added hasReaction("lunarCrystallize") as an alternative condition
    alongside hasShielder() using OR logic.
