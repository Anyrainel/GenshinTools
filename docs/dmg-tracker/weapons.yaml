# Weapons Damage Tracker
- id: sharpshooters-oath-weak-spot
  entity: sharpshooters_oath
  rule: U9
  status: wont-do
  category: engine-gap
  summary: >
    "Increases DMG against weak spots" doesn't map to any existing stat key.
    Needs a new weakSpot% key or similar to model.
  detail: >
    Requires engine feature: weak spot targeting system (new stat key weakSpot%
    plus formula-level targeting filter). This is a 3-star weapon with a niche
    mechanic that cannot be generalized — no other weapon or character buff uses
    weak spot DMG as a stat. Not worth the engine complexity for a 3-star bow.

- id: forest-regalia-pickup-gap
  entity: forest_regalia
  rule: U1
  status: wont-do
  category: engine-gap
  summary: >
    Leaf of Consciousness is a special pickup object that only one on-field
    character can pick up. The single-character pickup limitation is not enforced
    by the engine (teamOnField applies to all on-field instances).
  detail: >
    This is a systemic engine limitation that affects all special pickup objects,
    not specific to Forest Regalia. The teamOnField receiver is the closest
    available approximation per U1. Since Forest Regalia is a 4-star weapon and
    the pickup only generates one Leaf every 20 seconds (single buff instance),
    the practical impact is minimal — the on-field character at the time of
    pickup gets the buff, which teamOnField models correctly in most rotations.
    Not worth engine changes for this case.

- id: calamity-queller-consummation-ramp
  entity: calamity_queller
  rule: U4
  status: wont-do
  category: approximation
  summary: >
    Consummation ATK% ramps from 0 to 6 stacks over 6 seconds (1 stack/s).
    Implementation hardcodes max 6 stacks with off-field doubling (6*2*3.2%).
    Per S12, time-dependent ramps should use OptionMap with tiers or be documented
    as a forced approximation.
  detail: >
    The 6-second ramp is short relative to a typical rotation (20+ seconds).
    Calamity Queller is almost exclusively used on Shenhe, who uses E and
    immediately swaps off-field. By the time her teammates consume Icy Quill
    stacks (6+ seconds into the rotation), Consummation is at max stacks.
    The off-field doubling is also standard for Shenhe's playstyle. Under the
    peak-damage model (S6), max stacks after a short ramp with no team
    dependency is an acceptable assumption. The approximation has negligible
    impact on practical damage calculations.

