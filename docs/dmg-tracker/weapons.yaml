- id: prized-isshin-blade-proc-dmg
  entity: prized_isshin_blade
  rule: U9
  status: wont-do
  category: engine-gap
  summary: >
    Accursed Spirit proc (180% ATK AoE, every 8s on Normal/Charged/Plunge hit) has no formula.
    The engine does not support weapon-owned damage formulas, so the proc cannot be modeled.
  detail: >
    The engine has no mechanism for weapon-owned damage formulas. Weapons can
    provide stat buffs but cannot register their own formulaMap entries. This is
    a genuine engine gap requiring a new subsystem for weapon proc damage.
    Additionally, Prized Isshin Blade is a 4-star weapon with a -50% wielder DMG
    penalty, making it a niche choice. The 180% ATK proc every 8s is minor
    relative to character ability damage. Not worth engine changes for this case.

- id: flameforged-insight-missing-lunar-reactions
  entity: flameforged_insight
  rule: S10
  status: completed
  category: bug
  summary: >
    Flameforged Insight's reaction check is missing lunar reaction variants (lunarCharged,
    lunarBloom, lunarCrystallize). The game text explicitly lists all six reactions including
    lunar variants, but hasReaction() only checks the three base reactions. On Moonsign teams
    where lunar reactions supersede base reactions, the EM buff incorrectly deactivates.
  detail: >
    Added lunarCharged, lunarBloom, and lunarCrystallize to the canTrigger
    reaction gate in weapon4Claymore.ts, matching all six reactions listed
    in the game text.

- id: verdict-missing-lunar-crystallize
  entity: verdict
  rule: S10
  status: completed
  category: bug
  summary: >
    Verdict's Seal condition only checks hasReaction("crystallize") but the game text
    explicitly includes "触发月结晶反应" (Lunar-Crystallize). On Moonsign teams where
    the only Geo+element source is Hydro+Geo, crystallize is superseded by lunarCrystallize
    and hasReaction("crystallize") returns false, causing the Skill DMG buff to deactivate.
  detail: >
    Added hasReaction("lunarCrystallize") as an OR condition to the Seal
    gate in weapon5Claymore.ts, so the Skill DMG buff activates on both
    crystallize and lunarCrystallize teams.

- id: bloodsoaked-ruins-wrong-reaction-gate
  entity: bloodsoaked_ruins
  rule: S10
  status: completed
  category: bug
  summary: >
    Bloodsoaked Ruins gates buffs on hasReaction("electroCharged") but all its buffs
    target lunarCharged damage. When lunarCharged supersedes electroCharged (Moonsign
    teams), hasReaction("electroCharged") returns false and the buffs are never created.
    Should use hasReaction("lunarCharged") instead.
  detail: >
    Changed the reaction gate from hasReaction("electroCharged") to
    hasReaction("lunarCharged") in weapon5Polearm.ts. The buff filters
    already correctly targeted lunarCharged reactions.

