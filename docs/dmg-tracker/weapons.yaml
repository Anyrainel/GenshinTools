- id: angelos-heptades-shield-gate
  entity: angelos_heptades
  rule: U9
  status: completed
  category: bug
  summary: >
    Pathfinder's Light (ATK -> active-character dmg%) requires the equipping
    character to create a shield ("装备者创造护盾后"), but the ScalingBuff is
    emitted unconditionally without checking that the wielder is a shielder.
    Should gate on teamMeta.isShielder[this.charId], mirroring the
    starcallers_watch / fractured_halo shield-wielder pattern.
  detail: >
    Gated both Pathfinder's Light ScalingBuffs (main teamOnField dmg% and the
    Hexerei off-field 50% variant) inside if (this.teamMeta.isShielder[this.charId]),
    mirroring starcallers_watch / fractured_halo in this same file. The flat
    +ATK% StatBuff stays unconditional. The Hexerei: Secret Rite off-field clause
    keeps its countByFaction("Hexerei") >= 2 gate, now nested under the shielder
    check. Type-check passes for weapon5Catalyst.ts.

