- id: lost-prayer-selfonfield-receiver
  entity: lost_prayer_to_the_sacred_winds
  rule: U1
  status: intended
  category: bug
  summary: >
    Lost Prayer to the Sacred Winds uses receiver "selfOnField" for its 4-stack
    elemental DMG buff. Per game text, stacks persist until the character falls
    or leaves combat — they are retained while the wielder is off-field. The buff
    should apply to off-field damage sources (e.g., Mona Q persisting after swap),
    so the correct receiver is "self".
  detail: >
    the Chinese description is more accurate. The buff accumulates when “在场上”, and
    it disappear after “离场”. selfOnField is correct.

