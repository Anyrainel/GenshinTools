- id: prized-isshin-blade-proc-dmg
  entity: prized_isshin_blade
  rule: U9
  status: wont-do
  category: engine-gap
  summary: >
    Accursed Spirit proc (180% ATK AoE, every 8s on Normal/Charged/Plunge hit) has no formula.
    The engine does not support weapon-owned damage formulas, so the proc cannot be modeled.
  detail: >
    The engine has no mechanism for weapon-owned damage formulas. Weapons can
    provide stat buffs but cannot register their own formulaMap entries. This is
    a genuine engine gap requiring a new subsystem for weapon proc damage.
    Additionally, Prized Isshin Blade is a 4-star weapon with a -50% wielder DMG
    penalty, making it a niche choice. The 180% ATK proc every 8s is minor
    relative to character ability damage. Not worth engine changes for this case.

