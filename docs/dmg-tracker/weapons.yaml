- id: golden-frostbound-oath-mischief-unconditional
  entity: golden_frostbound_oath
  rule: U1
  status: completed
  category: bug
  summary: >
    Frost Fae's Mischief (other Geo DMG% + LC reactionDmg%) is always active
    regardless of team composition. The buff requires Moondrifts near the wielder,
    which only exist when lunarCrystallize has been triggered. On teams without
    Hydro+Geo+5-star Moonsign, the buff incorrectly applies to all other party members.
  detail: >
    Converted readonly buffs to a getter and gated the Frost Fae's Mischief
    buffs (other Geo DMG% + LC reactionDmg%) behind
    hasReaction("lunarCrystallize") in weapon5Bow.ts.

