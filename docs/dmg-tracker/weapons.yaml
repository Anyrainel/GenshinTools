- id: astral-vulture-swirl-unconditional
  entity: astral_vultures_crimson_plumage
  rule: U5
  status: completed
  category: bug
  summary: >
    ATK% buff ("after triggering Swirl") is unconditionally active. Per S6,
    reaction-triggered buffs must be gated on hasReaction("swirl", this.charId).
    Non-Anemo wielders or teams without a reactive element would incorrectly
    receive the ATK% bonus.
  detail: >
    Added hasReaction("swirl", this.charId) guard around the ATK% StatBuff.
    Non-Anemo wielders and mono-Anemo teams no longer receive the bonus.
  created: "2026-03-29"
  resolved: "2026-03-29"

- id: snare-hook-reaction-unconditional
  entity: snare_hook
  rule: U5
  status: completed
  category: bug
  summary: >
    EM buff ("after triggering elemental reaction") is unconditionally active.
    Per S6, reaction-triggered buffs should be gated on a hasReaction check.
    Teams with no reactive element pairs would incorrectly receive the EM bonus.
  detail: >
    Added canReact guard checking 11 representative reactions (vaporize, melt,
    overloaded, electroCharged, superconduct, frozen, bloom, burning, quicken,
    swirl, crystallize) with this.charId. EM buff now returns empty if the
    wielder cannot trigger any reaction.
  created: "2026-03-29"
  resolved: "2026-03-29"
