  rule: S6
  status: actionable
  category: bug
  summary: >
    Electrifying Edict (team-wide lunarCharged reactionDmg+) is gated on
    teamMeta.hasShielder(), but the game text requires the equipping character
    to create a shield ("装备者创造了护盾"). Should use
    teamMeta.isShielder[this.charId] instead so the buff only activates when
    the wielder is a shielder, matching the starcallers_watch pattern.
  detail: ""

- id: symphonist-of-scents-off-field-receiver
  entity: symphonist_of_scents
  rule: U1
  status: actionable
  category: bug
  summary: >
    The extra +12-24% ATK for off-field state is summed into the base ATK buff
    with receiver "self", causing it to apply on-field as well. The
    "当装备此武器的角色处于队伍后台时" clause requires a separate StatBuff with
    receiver "selfOffField" for the extra portion; the base 12-24% ATK stays on
    "self".
  detail: ""

- id: crimson-moons-semblance-bol-threshold
  entity: crimson_moons_semblance
  rule: S6
  status: actionable
  category: approximation
  summary: >
    The 24-56% DMG bonus requires Bond of Life >= 30% Max HP, but the
    implementation always sums both tiers unconditionally. The weapon's own
    Charged Attack generates only 25% Max HP BoL (max once per 14s), so
    reaching 30% requires external BoL sources (e.g., Arlecchino). Should be
    gated behind an OptionMap of BoL states or recognized as a forced-average
    approximation.
  detail: "Use OptionMap to gate the additional bonus, but default to ON."

