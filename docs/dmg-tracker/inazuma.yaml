- id: heizou-q-windmuster-iris
  entity: shikanoin_heizou
  rule: S8
  status: wont-do
  category: engine-gap
  summary: >
    Q Windmuster Iris (param2) deals elemental DMG matching the element affection on
    hit enemies. Requires element absorption modeling similar to Kazuha Q / Sayu E hold.
  detail: >
    S10 element absorption pattern is supported by the engine and could model this.
    However, Windmuster Iris DMG is only 38.6% ATK at Lv10 per iris (max 4 enemies).
    For single-target, this is ~1.2% of Heizou's total rotation DPS (2x E full
    conviction ~2600% + Q 566%). Even with 4 targets, it's ~4.6% per target.
    Below the 5% significance threshold. Not worth implementing.
  created: "2026-03-28"
  resolved: "2026-03-28"

- id: shinobu-e-ring
  entity: kuki_shinobu
  rule: S8
  status: wont-do
  category: missing-formula
  summary: >
    Missing E Grass Ring of Sanctification direct damage formula. Ring deals Electro DMG
    (E param4) every 1.5s for 12s off-field (~8 ticks), plus P2 EM->baseDmg bonus.
  detail: >
    Shinobu's primary role in meta is hyperbloom trigger, where she builds full EM.
    E ring direct damage scales off ATK (E param4 ~25% per tick at Lv10). With 8
    ticks, total is ~200% ATK, but on an EM build her ATK is very low. Even with
    P2's 25% EM->baseDmg per tick (at 800 EM = 200 flat per tick, 1600 total), this
    is negligible compared to 8 hyperbloom seeds at ~30k each (~240k total). The ring
    direct damage contributes well under 5% of rotation DPS. Not worth implementing.
  created: "2026-03-28"
  resolved: "2026-03-29"

