- id: yae_miko-c4-burst-dmg
  entity: yae_miko
  rule: U5
  status: completed
  category: bug
  summary: >
    C4's second clause "此外，八重神子的元素爆发伤害提升100%" (Yae's Elemental
    Burst DMG +100%) has no buff. Only the 20% team Electro DMG clause is
    implemented, so yae_miko-burst is undervalued by a factor of ~2 at C4+.
  detail: >
    Done. Added a StatBuff at constellation >= 4: dmg% 1.0, receiver "self",
    filter abilities ["burst"], cbs origin "C4". Separate from the existing C4 team
    Electro DMG buff, which stays team-wide and unfiltered.
- id: yae_miko-p4-enhanced-lightning-scope
  entity: yae_miko
  rule: U10
  status: completed
  category: bug
  summary: >
    P4's +80% ATK enhancement is a ScalingBuff with filter abilities ["skill"]
    and no maxStacks, so it lands on all 15 yae_miko-skill ticks plus
    yae_miko-p1-proc and yae_miko-p4-sc-proc. Game text enhances only "下一次
    杀生樱的落雷", once per 2.5s.
  detail: >
    Done, with one structural deviation from the prescribed shape, forced by the
    engine. bespokeMaxStacks() (core/statBuff.ts) takes maxStacks from the FIRST
    bespoke buff carrying one and applies the resulting cutoff to the WHOLE bespoke
    overlay of that part, and the unbuffed remainder is rebuilt from base stats with
    no bespoke buffs at all. Putting the P4 buff (maxStacks 7) in the same
    bespokeBuffs array as the always-on P2/C6 Sakura buffs would therefore have
    capped P2 and C6 at 7 of 15 bolts too - a large silent loss on Yae's biggest
    passive.
    Implemented instead with the buffed-first / unbuffed-subsequent form that U10
    lists as the alternate for this pattern, entirely inside the existing
    yae_miko-skill entry (no new formula id): comboDescriptor count 1, part 0 =
    hits 7 with bespokeBuffs [P2, C6, P4 +80% ATK], part 1 = hits 8 with
    bespokeBuffs [P2, C6]. Total Sakura bolts stay 15 and the enhanced count stays
    7, matching yae_miko-p4-sc-proc. Both parts keep offField: true. When the team
    has no Superconduct/Stellar-Conduct source the entry collapses to a single
    15-hit part with [P2, C6] and no P4 buff at all.
    Scope is fixed as a side effect: the P4 enhancement no longer exists as an
    abilities ["skill"] buff, so it cannot reach yae_miko-p1-proc or
    yae_miko-p4-sc-proc.
- id: yae_miko-sakura-scoped-buffs-leak
  entity: yae_miko
  rule: U5
  status: completed
  category: bug
  summary: >
    P2 (EM → Sakura DMG +0.15%/point) and C6 (Sakura attacks ignore 60% DEF)
    are scoped with filter abilities ["skill"], but both clauses name the
    Sesshou Sakura lightning specifically. Since P1/P4 procs are now separate
    skill-tagged formulas, both buffs leak onto yae_miko-p1-proc.
  detail: >
    Done. P2 (EM -> Sakura DMG +0.15%/point) and C6 (Sakura attacks ignore 60% DEF)
    moved out of the buffs array and onto the yae_miko-skill parts as bespokeBuffs,
    sharing one instance array (sakuraBuffs) across both parts so the BuffLedger
    dedupe by object identity keeps a single ledger row each. The
    abilities ["skill"] filters are gone, so neither buff can reach
    yae_miko-p1-proc or yae_miko-p4-sc-proc. Landed in the same pass as
    yae_miko-p4-enhanced-lightning-scope; see that item for the part split those
    three buffs now ride on.
- id: yae_miko-c1-trigger-label
  entity: yae_miko
  rule: U7
  status: completed
  category: bug
  summary: >
    C1's two buffs use triggers ["passive"], but the clause fires on
    "触发超导/星超导反应或造成星超导反应伤害". U7 requires labelling at the
    granularity the text uses, i.e. ["superconduct", "stellarConduct"].
  detail: >
    Done. C1's two buffs now carry triggers ["superconduct", "stellarConduct"], and
    C6's Stellar-Conduct CRIT DMG buff carries triggers ["stellarConduct"] (origin
    unchanged at C6). The runtime gate (hasScReaction) is untouched. No
    "stellar-reaction" label was used - neither clause is a stellar umbrella clause.
- id: mizuki-radiance-option
  entity: yumemizuki_mizuki
  rule: S1b
  status: completed
  category: bug
  summary: >
    Mizuki has no OptionDef and no Radiance handling at all, but her P4 states
    "队伍中的角色在附近触发星扩散反应后的8秒内，梦见月瑞希将会进入辉映·星扩散状态".
    She is a Radiance carrier (Stellar Swirl), not a Radiance-free 6.7 kit.
  detail: >
    Done. Registered @RegisterCharacter("yumemizuki_mizuki", mizukiOption) with the
    S1b two-choice schema, label Radiance: Stellar Swirl, "off" first so it is the
    default, "on" gated on tm.hasReaction("stellarSwirl") only. Exposed as
    private readonly radianceOn. Her option slot was free, so nothing was displaced.
    All nine sibling items landed in the same change.
- id: mizuki-p4-stellar-hit
  entity: yumemizuki_mizuki
  rule: S1
  status: completed
  category: missing-formula
  summary: >
    P4's Radiance clause — the enhanced periodic Dreamdrifter hit also deals an
    extra 1000%-EM Anemo instance "视为星扩散反应造成的伤害" — is not modelled.
  detail: >
    Done. Added formula entry "mizuki-p4-stellar" (label P4 Stellar Swirl), gated on
    radianceOn, one part with
    StellarDirectFormula(10.0, { Anemo, skill, stellarSwirl }, "em") and no offField
    flag - the hit lands while she is drifting on-field. comboDescriptor count 4,
    matching the maxStacks 4 settled in mizuki-p4-tick-budget.
- id: mizuki-c1-stellar-branch
  entity: yumemizuki_mizuki
  rule: S1b
  status: completed
  category: bug
  summary: >
    C1's Radiance clause "上述额外伤害转为梦见月瑞希元素精通的400%的风元素伤害，
    该伤害视为星扩散反应造成的伤害" replaces the 1000%-EM extra hit. The impl only
    has the non-Radiance DirectFormula(10.0, anemoSkill, "em") branch.
  detail: >
    Done. The C1 extra-hit part inside mizuki-skill-swirl now branches: radianceOn
    -> StellarDirectFormula(4.0, { Anemo, skill, stellarSwirl }, "em"), otherwise the
    existing DirectFormula(10.0, anemoSkill, "em"). Replace, not overlay, and the
    part's position and count are unchanged.
- id: mizuki-e-stellar-swirl-buff
  entity: yumemizuki_mizuki
  rule: U3
  status: completed
  category: bug
  summary: >
    E grants two separate team reaction-DMG bonuses — param2 for 扩散 and
    param6 for 星扩散 ("每100点精通提升星扩散伤害百分比"). Only the Swirl buff
    exists, so Stellar Swirl teams lose her signature E buff entirely.
  detail: >
    Done. Added a second E ScalingBuff: receiver "team", filter
    reactions ["stellarSwirl"], em -> reactionDmg%, scale this.param("E", 6) / 100
