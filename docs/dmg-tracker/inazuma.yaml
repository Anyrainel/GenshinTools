- id: mizuki-c1-stellar-swirl-bonus
  entity: yumemizuki_mizuki
  rule: U3
  status: completed
  category: bug
  summary: >
    C1 boosts the marked reaction by 1100% EM for 扩散 and 550% EM for 星扩散
    ("提升值分别相当于…1100%/550%"). Only the 1100% Swirl entry exists.
  detail: >
    Done. Added a second C1 ScalingBuff mirroring the Swirl one - receiver "team",
    filter reactions ["stellarSwirl"], em -> baseDmg, scale 5.5. The 1100% Swirl
    entry is unchanged; the two amounts stay in separate entries.
- id: mizuki-c6-stellar-swirl-crit
  entity: yumemizuki_mizuki
  rule: U3
  status: completed
  category: bug
  summary: >
    C6's clause "并使这些角色造成的星扩散反应伤害暴击率提升10%，暴击伤害提升20%"
    is missing. Only the fixed 30%/100% Swirl CRIT entry is implemented.
  detail: >
    Done. Added a StatBuff at C6: receiver "team", filter
    reactions ["stellarSwirl"], reactionCr 0.1 and reactionCd 0.2. Kept separate
    from the fixed 30%/100% Swirl CRIT profile.
- id: mizuki-c6-self-crit-misrouted
  entity: yumemizuki_mizuki
  rule: U3
  status: completed
  category: bug
  summary: >
    C6's EM-above-500 clause buffs Mizuki's OWN CRIT Rate/DMG (up to +20%/+80%
    at 1000 EM), but it is implemented as two team-wide ScalingBuffs writing
    reactionCr/reactionCd with filter reactions ["swirl"] — wrong receiver,
    wrong keys, and a scope the text never mentions.
  detail: >
    Done, with the CRIT Rate half approximated - see mizuki-c6-crit-rate-em-scale.
    Both team-wide reactionCr/reactionCd ScalingBuffs with the invented
    reactions ["swirl"] filter were removed. CRIT DMG is now
    ScalingBuff(receiver "self", em -> "cd", 0.0016, cap 0.8, threshold 500), no
    filter, which correctly reaches her own Stellar Swirl direct hits.
    CRIT Rate could not be shipped in the same scaling form: a ScalingBuff with
    outputKey "cr" is rejected by the "No scaling ER/CR buffs" guard in
    tests/lib/team-comp/calc/instantiation.test.ts, because the optimizer
    precomputes crFloor from empty artifact sheets and a scaling cr buff makes that
    floor depend on the artifacts being searched. Shipped as a static
    StatBuff(receiver "self", cr 0.2) - the clause's own cap, reached at 1000 EM -
    with the assumption documented at the call site. The guard's allowlist was
    deliberately not touched.
- id: mizuki-swirl-gate-supersede
  entity: yumemizuki_mizuki
  rule: U12
  status: completed
  category: bug
  summary: >
    formulaMap gates her main damage entry on
    canSwirl = teamMeta.hasReaction("swirl"). On a Cryo-swirl Stellar team the
    base reaction is superseded (STELLAR_SUPERSEDES.swirl), so hasReaction
    returns false and mizuki-skill-swirl — periodic E damage, the P4 bespoke
    buff and the C1 extra hit — silently disappears.
  detail: >
    Done. The formulaMap gate is now
    hasReaction("swirl") || hasReaction("stellarSwirl"), so the entry (periodic E
    damage, the P4 bespoke buff, the C1 extra hit) survives on a fully superseded
    Cryo-swirl team. The TransformFormula(1.0, { Anemo, skill, "swirl" }) part alone
    stays on the narrow hasReaction("swirl") gate and is spread out of the parts
    array when false; the label drops the swirl suffix in that case. The rationale
    (rx-stellarSwirl carries no proc damage, all Stellar DPS comes from the explicit
    StellarDirectFormula entries, and a live swirl part would collect base-Swirl
    buff values for a converted reaction) is recorded in a code comment at the gate.
- id: mizuki-p4-tick-budget
  entity: yumemizuki_mizuki
  rule: U10
  status: completed
  category: approximation
  summary: >
    The P4 +1000% EM bespokeBuff sits on the mizuki-skill-swirl periodic part,
    which has combo count 6, but the enhancement can only fire once every 2.5s
    and requires a Swirl/Stellar Swirl trigger, so fewer than 6 ticks are
    actually enhanced.
  detail: >
    Done. maxStacks 4 on the P4 bespokeBuff attached to the mizuki-skill-swirl
    periodic part (combo count 6), so 4 of 6 ticks are enhanced. The derivation -
    5s Dreamdrifter at Lv10 + 2 x 2.5s from P1 = 10s window, 10s / 2.5s ICD = 4 - is
    in a code comment. The same 4 is used as the combo count for
    "mizuki-p4-stellar".
- id: mizuki-c6-crit-rate-em-scale
  entity: yumemizuki_mizuki
  rule: U3
  status: open
  category: approximation
  summary: >
    C6's EM-above-500 clause raises Mizuki's own CRIT Rate by 0.04% per point
    (cap +20%) and CRIT DMG by 0.16% per point (cap +80%). CRIT DMG is modelled
    as a ScalingBuff, but the CRIT Rate half is pinned to its +20% cap because a
    ScalingBuff with outputKey "cr" is not representable in the optimizer's
    constraint model.
  detail: >
    Raised while implementing mizuki-c6-self-crit-misrouted. The optimizer
    precomputes crFloor via getTeamStats with empty artifact sheets and then
    checks crFloor + artifactCr >= minCr; a cr buff that scales with EM makes
    that floor depend on the artifacts being searched, which the precomputed
    model cannot express. tests/lib/team-comp/calc/instantiation.test.ts guards
    this with a small curated allowlist (traveler_electro, rosaria, nahida,
    nilou, sigewinne), and the allowlist was deliberately not extended here.
    Current implementation: StatBuff(receiver "self", cr 0.2) - the clause's own
    cap, which is reached at exactly 1000 EM. A C6 Mizuki is a pure EM support
    (EM sands/goblet/circlet, plus +100 EM from her own P2), so 1000 EM is at or
    below a realistic build; the approximation is exact at 1000+ EM and a small
    overstatement on under-invested builds. The CRIT DMG half is unaffected and
    still scales exactly.
    To model this properly, the guard would have to accept the optimizer's
    existing estimateScalingBonus path in
    src/lib/team-comp/optimizer/constraintChecker.ts, which already handles
    capped scaling cr buffs by using the cap as the estimate - precisely what
    the allowlisted nahida P2 (EM -> cr, self) relies on. Re-decide the
    allowlist policy before converting this back to a ScalingBuff.
