# Inazuma Damage Tracker
- id: sayu-e-hold-absorption
  entity: sayu
  rule: S8
  status: wont-do
  category: engine-gap
  summary: >
    E hold mode absorption damage not modeled (requires element absorption modeling).
  detail: >
    Engine now supports S10 element absorption pattern (iterate team elements, create
    per-element formula variants — see Traveler Anemo Q implementation). However, Sayu
    is a healer support with minimal field time; E hold absorption ticks are negligible
    DPS contribution (<2%). Not worth implementing.

- id: heizou-q-windmuster-iris
  entity: shikanoin_heizou
  rule: S8
  status: wont-do
  category: engine-gap
  summary: >
    Q Windmuster Iris (param2) deals elemental DMG matching the element affection on
    hit enemies. Requires element absorption modeling similar to Kazuha Q / Sayu E hold.
  detail: >
    S10 element absorption pattern is supported by the engine and could model this.
    However, Windmuster Iris DMG is only 38.6% ATK at Lv10 per iris (max 4 enemies).
    For single-target, this is ~1.2% of Heizou's total rotation DPS (2x E full
    conviction ~2600% + Q 566%). Even with 4 targets, it's ~4.6% per target.
    Below the 5% significance threshold. Not worth implementing.

- id: shinobu-e-ring
  entity: kuki_shinobu
  rule: S8
  status: completed
  category: missing-formula
  summary: >
    Missing E Grass Ring of Sanctification direct damage formula. Ring deals Electro DMG
    (E param4) off-field for the E duration, plus the P2 EM->baseDmg bonus.
  detail: >
    Reversal of the earlier wont-do (which argued the ring was under 5% of rotation
    DPS on an EM hyperbloom build): the maintainer approved implementing it, since
    P2 has no other valid target and was removed for lack of one. Added the
    "shinobu-e-ring" formula — DirectFormula(param(E,4), Electro/skill/none, ATK
    scaling), offField, with hits derived from the duration param:
    floor((param(E,6) + 3 at C2) / 1s). The 1s tick interval is maintainer-provided
    (the skill text quotes 1.5s) and is documented at the call site. P2 is
    reattached as a bespokeBuff on that part only — ScalingBuff em -> baseDmg at
    0.25, receiver "self" with an abilities:["skill"] filter — so it can no longer
    reach shinobu-c4-thundergrass. Added to comboDescriptor with count 1.

- id: kokomi-jellyfish-offfield-q
  entity: sangonomiya_kokomi
  rule: S13
  status: wont-do
  category: bug
  summary: >
    Bake-Kurage formula has offField: true, but during Q rotation Kokomi is on-field.
    The Q Kurage DMG bonus (ScalingBuff with selfOnField + skill filter) won't apply
    to the off-field-flagged jellyfish formula, under-reporting Q-buffed jellyfish damage.
  detail: we have a force onField feature, if users would actually use the damage from the jellyfish, they can force it.

- id: sayu-c2-kick-dmg
  entity: sayu
  rule: S6
  status: wont-do
  category: bug
  summary: >
    C2 Whirlwind Kick hold DMG bonus (+66%) is not modeled. This is an unconditional
    buff at max stacks (10s hold = 20×0.5s = 20 increments, capped at 66%) that should
    apply as a dmg% StatBuff with filter abilities: ["skill"] when constellation >= 2.
  detail: >
    Sayu is a 4-star Anemo healer/support whose value lies in VV shred, healing,
    and P1 swirl-triggered heals. Her E hold Whirlwind Kick damage is a negligible
    portion of team DPS even with C2's +66% bonus. The missing buff affects only
    one hit per E hold cast. In any team composition, Sayu's personal damage
    contributes well under 5% of team DPS. Not worth implementing for a healer
    support character.

- id: chiori-p1-coord-offfield
  entity: chiori
  rule: S11
  status: completed
  category: bug
  summary: >
    chiori-e-combo bundles the on-field upward sweep with 2 P1 coordinated attacks as
    hits:3 on a single on-field part. P1 coordinated attacks occur after Tapestry swap,
    so Chiori is off-field for those 2 hits. The part should be split so the sweep stays
    on-field and the 2 P1 coordinated hits are marked offField: true.
  detail: >
    Split chiori-e-combo part 1 into two parts sharing the same E param5 ATK /
    E param6 DEF multipliers: the upward sweep (1 hit, on-field) and the P1
    Tapestry coordinated attacks (hits: 2, offField: true).

- id: yoimiya-c6-separate-formula
  entity: yoimiya
  rule: S9
  status: completed
  category: approximation
  summary: >
    C6 extra Blazing Arrow (50% chance, 60% DMG) is modeled as a separate formulaMap
    entry yoimiya-c6-arrow with count:0 default, rather than as a dmg% or baseDmg% buff
    on the existing yoimiya-normal formula. Per S9, constellations enhancing an existing
    attack should be modeled as buffs, not separate formula entries.
  detail: >
    Deleted the yoimiya-c6-arrow formula entry and its count:0 comboDescriptor
    line. C6 is now a StatBuff at C6+ with baseDmg% +0.3 (expected value
    0.5 x 0.6), receiver selfOnField, filter abilities ["normal"], so it rides
    the existing yoimiya-normal chain.

- id: kirara-e-q-kit-damage
  entity: kirara
  rule: S7
  status: completed
  category: missing-formula
  summary: >
    Kirara only models her C4 coordinated attack, but her kit has direct E/Q damage
    rows and P2 explicitly buffs Meow-teor Kick and Secret Art: Surprise Dispatch
    damage based on Max HP.
  detail: >
    Added five Dendro DirectFormula entries: kirara-skill (E param1),
    kirara-e-collision (E param7), kirara-e-flipclaw (E param9), kirara-burst
    (Q param1) and kirara-cardamom (Q param2). P2 split into two hp -> dmg%
    ScalingBuffs: the E half (0.4% per 1000 HP) is a self buff with filter
    abilities ["skill"], while the Q half (0.3% per 1000 HP) is a bespokeBuff on
    kirara-burst and kirara-cardamom only, so it never reaches kirara-c4-steed.
    comboDescriptor now runs E press + Q initial + 3 Cardamoms (bonus minC 1
    delta 4) + 5 C4 procs; the two hold-mode E formulas exist but are left out of
    the default rotation since press and hold are mutually exclusive.

- id: gorou-q-collapse-modeling
  entity: gorou
  rule: S7
  status: completed
  category: bug
  summary: >
    Gorou's Q formula models only a single Crystal Collapse hit, but General's
    Glory generates one every 1.5s for the field's whole duration.
  detail: >
    Crystal Collapse part now carries hits: floor(Q param3 / 1.5) = 6, extended
    to floor((Q param3 + 3) / 1.5) = 8 when constellation >= 2 and the team can
    trigger Crystallize (hasReaction("crystallize") || hasReaction("lunarCrystallize"),
    per U12's lunar-superseding rule). The bespoke P2 DEF buff was left untouched
    — bespokeBuffs bypass receiver resolution entirely (buildBespokeOverlay reads
    only target.filter), so its receiver is inert and it already reaches the
    offField collapse part.

- id: sara-c2-crowfeather-damage
  entity: kujou_sara
  rule: S7
  status: completed
  category: bug
  summary: >
    Sara C2's weaker Crowfeather damage is not modeled; the E formula only
    includes the normal Tengu Juurai: Ambush hit.
  detail: >
    sara-skill gains a second part at constellation >= 2 with
    this.param("E", 1) * 0.3 (Electro/skill/none), matching the "造成原本30%的伤害"
    text and gcsim's 0.3 * skill[TalentLvlSkill]. Label switches to
    "E伏伤害+乌羽" / "E Ambush + Crowfeather" at C2.

- id: shinobu-p2-overbuffs-c4
  entity: kuki_shinobu
  rule: U5
  status: completed
  category: bug
  summary: >
    Shinobu's P2 EM-to-baseDmg buff is scoped to all skill damage, so it buffs the
    C4 Thundergrass Mark even though P2 only increases Grass Ring of
    Sanctification damage.
  detail: >
    Removed the skill-filtered P2 ScalingBuff. P2 only boosts Grass Ring damage,
    and at the time the ring's direct-damage formula was not modelled, so the
    buff had no valid target — its entire effect was landing on
    shinobu-c4-thundergrass. P2 has since been reattached as a bespokeBuff on the
    new shinobu-e-ring part (see shinobu-e-ring), which is the only formula it
    may affect.

- id: sayu-c6-daruma-scope
  entity: sayu
  rule: U5
  status: completed
  category: bug
  summary: >
    Sayu C6's EM-to-baseDmg buff is scoped to all Burst damage, so it also buffs
    the Q initial hit even though C6 only enhances Muji-Muji Daruma damage.
  detail: >
    Moved the C6 CrossScalingBuff out of the buffs array and onto the sayu-daruma
    part as a bespokeBuff (still constellation >= 6, receiver "self",
    min(em * 0.002, 4.0) * atk -> baseDmg). sayu-q-initial no longer picks it up.

- id: thoma-q-initial-c2-count
  entity: thoma
  rule: S7
  status: completed
  category: bug
  summary: >
    Thoma's Q modeling omits the initial Crimson Ooyoroi skill hit and keeps
    Fiery Collapse at 15 hits even when C2 extends the duration by 3s.
  detail: >
    Added thoma-burst-initial (Q param1, Pyro/burst/none, on-field) and changed
    the combo to `[{ thoma-burst-initial, 1 }, { thoma-burst-collapse, 15,
    bonus: [{ minC: 2, delta: 3 }] }]`, so C2 rotations run 18 collapses.
    Thoma's E damage (E param1) is still unmodelled — outside this item.

- id: chiori-p2-construct-gate
  entity: chiori
  rule: U9
  status: completed
  category: bug
  summary: >
    Chiori's P2 Geo DMG Bonus is always active, but The Finishing Touch requires
    a nearby party member to create a Geo Construct, or C1 to trigger it through
    a non-Chiori Geo teammate.
  detail: >
    Hoisted the Geo-construct detection out of the formulaMap IIFE into private
    readonly fields (GEO_CONSTRUCT_CHARS is now a module const) and gated the P2
    +20% geo% StatBuff on `hasFinishingTouch` — a construct teammate at C0, or
    additionally any other Geo teammate at C1+. The Tamoto count reuses the same
    field, and the buff source now reads origin "P2" / "P2/C1" with trigger
    "geo-construct" instead of an empty trigger list.

- id: raiden-e-burst-buff-offfield
  entity: raiden_shogun
  rule: U1
  status: completed
  category: bug
  summary: >
    Raiden's E Burst DMG Bonus is emitted as teamOnField per character, so it
    does not apply to off-field Burst damage even though Eye of Stormy Judgment
    buffs each affected character's Elemental Burst damage.
  detail: >
    Changed the per-teammate Eye of Stormy Judgment StatBuff receiver from
    "teamOnField" to "team", keeping charId and filter abilities ["burst"] and
    the E param4 * energy-cost scaling. Off-field Burst formulas (persistent
    deployables) now receive the bonus.

- id: kazuha-absorption-selection
  entity: kaedehara_kazuha
  rule: U11
  status: wont-do
  category: engine-gap
  summary: >
    Kazuha's P1/Q absorbed-element formulas are selected from team composition,
    and comboDescriptor defaults to the first present absorbable element, but
    formula absorption depends on in-game aura priority and enemy state.
  detail: >
    Formula absorption is not derivable from team composition alone. It depends
    on aura priority and enemy state, so choosing the first present team element
    can be wrong in multi-absorbable teams. Treat the current team-order default
    as an unsupported approximation and do not rely on it for tracked damage.

- id: yae_miko-p1-e-cast-proc
  entity: yae_miko
  rule: S11
  status: completed
  category: bug
  summary: >
    P1 extra lightning was correctly split out into yae_miko-p1-proc, but the
    new part carries offField: true. The proc fires when Yae casts E with 3
    Sakura nearby, so she is on-field for it and the flag wrongly strips
    on-field buffs (her own C2 teamOnField EM, teammates' teamOnField buffs).
  detail: >
    Done. Removed offField: true from the yae_miko-p1-proc part - the proc fires on
    the E cast, which Yae can only perform while active. The earlier split (separate
    formula entry, combo count 4) is unchanged, and the genuinely off-field parts
    (yae_miko-skill Sakura bolts, yae_miko-p4-sc-proc) keep their flag.
- id: yae_miko-c2-em-buff
  entity: yae_miko
  rule: U1
  status: completed
  category: bug
  summary: >
    C2 EM grant is implemented as two buffs, receiver "self" +200 EM and
    receiver "teamOnField" +200 EM. Both match Yae on her own on-field parts
    (RECEIVER_RULES.teamOnField ignores the provider), so Yae's burst and any
    non-offField part see +400 EM instead of +200.
  detail: >
    Done. Second C2 buff receiver changed teamOnField -> otherOnField, so the
