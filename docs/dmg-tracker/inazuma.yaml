- id: mizuki-e-swirl-scale
  entity: yumemizuki_mizuki
  rule: S5
  status: completed
  category: bug
  summary: >
    The E Swirl buff uses this.param("E", 2) / 10000, which is 100x too small.
    The talent row is labelled "每100点精通提升扩散伤害百分比" and param2 is a
