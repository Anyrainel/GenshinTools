# Fontaine Damage Tracker

- id: "lynette-missing-formulas"
  entity: "lynette"
  rule: "S8"
  status: wont-do
  category: "missing-formula"
  summary: >
    Lynette has no damage formulas at all. C6 grants Anemo infusion and +20% Anemo DMG
    bonus, signaling that her attacks are intended to deal meaningful damage at C6. At
    minimum, an E Enigma Thrust formula should be added since it is her primary damage source.
  detail: >
    Lynette is a 4-star Anemo support whose value lies in VV shred and P1 team ATK buff.
    KQM guide confirms her personal damage is negligible and talent levels (except Q) are
    low priority. Even at C6 with Anemo infusion, her on-field DPS window is brief and
    contributes well under 5% of team DPS in any recommended rotation. Not worth modeling.

- id: "charlotte-e-mark-tick"
  entity: "charlotte"
  rule: "S8"
  status: wont-do
  category: "missing-formula"
  summary: >
    E Focused Impression mark (param6) deals periodic off-field Cryo Skill DMG that is not
    modeled. With Hold E used in rotation, this contributes meaningful off-field damage over
    the mark's duration.
  detail: >
    Focused Impression deals 73.1% per tick every 1.5s over 12s = ~8 ticks = ~585% total.
    Charlotte is a 4-star Cryo healer — KQM guide confirms her skill levels are low priority
    and personal damage is not her value. In a team context, ~585% ATK from mark ticks is
    well under 5% of team rotation DPS. The existing E Hold and Q formulas adequately
    capture Charlotte's damage contribution.

- id: "furina-c2-hp-approx"
  entity: "furina"
  rule: "S12"
  status: wont-do
  category: "approximation"
  summary: >
    C2 HP% bonus is hardcoded to max (140%) but ramps with Fanfare overflow above cap.
    Since the entity already uses OptionMap for Fanfare stacks, forced averaging is acceptable
    but should be documented.
  detail: acknowledge the problem, will tackle this later.

- id: "clorinde-impale-ability"
  entity: "clorinde"
  rule: "S4"
  status: actionable
  category: "bug"
  summary: >
    Impale the Night damage is tagged as Elemental Skill DMG, but the talent text says damage
    dealt during Hunter's Vigil is considered Normal Attack DMG. This makes normal-attack buffs
    miss the lunge and skill-only buffs apply when they should not.
  detail: >
    Impale the Night damage during Hunter's Vigil should be treated as Normal
    Attack DMG, not Elemental Skill DMG, so Normal Attack buffs apply and
    skill-only buffs do not.

- id: "emilie-c6-charged-formula"
  entity: "emilie"
  rule: "S7"
  status: actionable
  category: "missing-formula"
  summary: >
    C6 converts both Normal and Charged Attack DMG to Dendro and adds ATK-scaling base damage,
    but only the Normal Attack sequence has a C6 formula. The charged attack variant is missing.
  detail: >
    Add a C6 charged attack formula using A param5 with Dendro/charge/none and the existing
    C6 baseDmg buff.

- id: "emilie-c6-source-triggers"
  entity: "emilie"
  rule: "U7"
  status: actionable
  category: "bug"
  summary: >
    The C6 buff source lists only Elemental Skill as a trigger, but Abiding Fragrance is granted
    after using either Fragrance Extraction or Aromatic Explication. The source display should
    include both E and Q.
  detail: >
    Abiding Fragrance is granted after either Fragrance Extraction or Aromatic
    Explication, so the C6 source display should show both E and Q as valid
    triggers.

- id: "furina-q-healing-bonus"
  entity: "furina"
  rule: "U8b"
  status: actionable
  category: "bug"
  summary: >
    Let the People Rejoice grants both DMG Bonus and Incoming Healing Bonus from Fanfare, but
    the implementation only emits the DMG Bonus. Healing Bonus is a modeled stat and should be
    included with the same Fanfare scaling.
  detail: >
    Healing Bonus is a modeled stat. Let the People Rejoice should grant the
    Incoming Healing Bonus alongside the existing Fanfare DMG Bonus using the
    same Fanfare scaling.

- id: "furina-c6-charged-formula"
  entity: "furina"
  rule: "S7"
  status: actionable
  category: "missing-formula"
  summary: >
    C6 Center of Attention converts Normal, Charged, and Plunging Attacks to Hydro and adds
    Max HP-scaling base damage, but the charged attack variant has no formula.
  detail: >
    Add a C6 charged attack formula using A param5 with Hydro/charge/none and the existing C6
    baseDmg buffs.

- id: "navia-crystalshot-buff-scope"
  entity: "navia"
  rule: "U5"
  status: actionable
  category: "bug"
  summary: >
    Crystalshot-only buffs are scoped to all Elemental Skill damage, so C2 CR, C6 CRIT DMG,
    and the shrapnel/all-shots-hit modifiers also buff Navia's Surging Blade proc. Those bonuses
    should apply only to Ceremonial Crystalshot itself.
  detail: >
    C2 CR, C6 CRIT DMG, and shrapnel/all-shots-hit modifiers should apply only
    to Ceremonial Crystalshot damage, not to separate Skill damage such as
    Surging Blade.

- id: "navia-c2-support-shot"
  entity: "navia"
  rule: "S9"
  status: actionable
  category: "missing-formula"
  summary: >
    C2 adds one Cannon Fire Support shot when Ceremonial Crystalshot hits, and that damage is
    considered Elemental Burst DMG. The current combo only models support fire from Navia's burst,
    not the extra C2 proc triggered by each skill use.
  detail: >
    Add a C2-gated support-fire formula or part using Q param2 as Geo/burst/none. The rotation
    uses two Ceremonial Crystalshots, so the combo count should be 2 at C2+.

- id: "wriothesley-p1-low-hp-option"
  entity: "wriothesley"
  rule: "U9"
  status: actionable
  category: "bug"
  summary: >
    C0 Gracious Rebuke is always modeled as active, but the passive requires Wriothesley's HP
    to be below 60%. HP-state conditions should be represented by an option instead of being
    assumed always on.
  detail: >
    Gracious Rebuke depends on Wriothesley's HP being below 60%. Represent the
    low-HP state explicitly instead of assuming the enhanced Rebuke is always
    active.

- id: "wriothesley-c4-off-field-receiver"
  entity: "wriothesley"
  rule: "U1"
  status: actionable
  category: "bug"
  summary: >
    The C4 off-field overflow branch grants ATK SPD to all party members, but it is modeled as
    otherOnField. This only buffs the active teammate and misses the full team scope described
    by the constellation.
  detail: >
    The off-field overflow branch grants ATK SPD to all party members, so it
    should reach the whole party rather than only the active non-Wriothesley
    teammate.

- id: "lyney-e-hat-explosion"
  entity: "lyney"
  rule: "S7"
  status: actionable
  category: "missing-formula"
  summary: >
    Bewildering Lights should detonate Lyney's Grin-Malkin Hat if one is present, dealing damage
    equal to Pyrotechnic Strike and counting as Charged Attack DMG. The E formula only includes
    the skill hit plus Prop Surplus scaling.
  detail: >
    Add a Charged Attack Pyro part to lyney-skill-max using A param15 when a hat is expected to
    be present before E.

- id: "lyney-c2-cd-ramp"
  entity: "lyney"
  rule: "U11"
  status: actionable
  category: "bug"
  summary: >
    C2 Crisp Focus is hardcoded at the maximum 60% CRIT DMG, but it ramps by one stack every
    2 seconds while Lyney remains on-field. Time-ramping buffs should use selectable tiers
    instead of always assuming the final value.
  detail: >
    Crisp Focus ramps one stack every 2 seconds while Lyney remains on-field.
    Expose the stack tier rather than hardcoding the final 60% CRIT DMG value
    for all evaluations.
