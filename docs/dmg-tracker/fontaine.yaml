    param is the current convention).

- id: "navia-crystalshot-buff-scope"
  entity: "navia"
  rule: "U5"
  status: completed
  category: "bug"
  summary: >
    Crystalshot-only buffs are scoped to all Elemental Skill damage, so C2 CR, C6 CRIT DMG,
    and the shrapnel/all-shots-hit modifiers also buff Navia's Surging Blade proc. Those bonuses
    should apply only to Ceremonial Crystalshot itself.
  detail: >
    Moved the four Crystalshot-only modifiers (C2 cr +0.36, C6 cd +1.35, E
    intrinsic baseDmg% +1.0 and dmg% +0.45) out of the class-level buffs array
    into a new private crystalshotBuffs field, attached as bespokeBuffs on the
    navia-crystalshot part. They no longer leak into navia-surging-blade or the
    new C2 support-fire entry. P1/P2/C4 remain regular buffs.

- id: "navia-c2-support-shot"
  entity: "navia"
  rule: "S9"
  status: completed
  category: "missing-formula"
  summary: >
    C2 adds one Cannon Fire Support shot when Ceremonial Crystalshot hits, and that damage is
    considered Elemental Burst DMG. The current combo only models support fire from Navia's burst,
    not the extra C2 proc triggered by each skill use.
  detail: >
    Added formulaMap entry "navia-c2-support" (minC 2): DirectFormula on
    this.param("Q", 2) with Geo/burst/none, one shot per Crystalshot cast.
    comboDescriptor registers it as count 0 with bonus [{ minC: 2, delta: 2 }],
    matching the two Crystalshots in the modeled rotation. navia-burst's
    existing 4 Q param2 ticks were left unchanged.

- id: "wriothesley-c1-radiance-cross-buff-scope"
  entity: "wriothesley"
  rule: "U5"
  status: wont-do
  category: "approximation"
  summary: >
    The C1 Radiance cross-buff (Luster boosts the next enhanced NA5 by 50%, NA5
    boosts Luster by 50%) is modeled with both legs permanently active, since the
    peak rotation alternates the two hits inside the 5s windows.
  detail: >
    Each leg is now a bespokeBuff on exactly the hit the text names, so the
    scoping itself is exact; only the uptime is assumed. Modeling the alternation
    would need per-hit ordering the combo model does not carry.

- id: "lyney-e-hat-explosion"
  entity: "lyney"
  rule: "S7"
  status: completed
  category: "missing-formula"
  summary: >
    Bewildering Lights should detonate Lyney's Grin-Malkin Hat if one is present, dealing damage
    equal to Pyrotechnic Strike and counting as Charged Attack DMG. The E formula only includes
    the skill hit plus Prop Surplus scaling.
  detail: >
    Added a second part to lyney-skill-max: DirectFormula on
    this.param("A", 15) (Pyrotechnic Strike) tagged Pyro/charge/none, per
    「通过这种方式引爆怪笑猫猫帽造成的伤害视为重击伤害」. Deliberately no P1
    bespoke baseDmg buff — P1 only enhances a Hat summoned by a Prop Arrow that
    consumed HP. lyney-strike stays at count 3, since the detonation replaces
    the Q-summoned Hat's own end-of-life Strike. Label updated to
    "E(满层)+引爆猫帽" / "E (Max) + Hat Blast".

- id: "lyney-c2-cd-ramp"
  entity: "lyney"
  rule: "U11"
  status: completed
  category: "approximation"
  summary: >
    C2 Crisp Focus is hardcoded at 3 stacks (+60% CRIT DMG) with no note that stacks accrue one
    per 2s of on-field time. Only the opening ~6s of each on-field window is over-credited —
    roughly the first of the three aimed shots in the modeled rotation — after which the buff
    plateaus at max for the rest of the window.
  detail: >
    Documented the assumption in a code comment above the C2 StatBuff: Crisp
    Focus accrues 1 stack per 2s on-field and releases on swap-out, so only the
    opening ~6s of each on-field window (roughly the first of the three aimed
    shots) is over-credited, after which it plateaus at max for the rest of
    Lyney's ~15-20s window. Modeled at max; ramp-up not tracked, following the
    Wanderer C6 precedent. No OptionMap added — the accuracy gain does not
    justify spending Lyney's single OptionDef slot.
