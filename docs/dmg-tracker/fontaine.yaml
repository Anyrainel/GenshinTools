- id: "emilie-c6-source-triggers"
  entity: "emilie"
  rule: "U7"
  status: completed
  category: "bug"
  summary: >
    The C6 buff source lists only Elemental Skill as a trigger, but Abiding Fragrance is granted
    after using either Fragrance Extraction or Aromatic Explication. The source display should
