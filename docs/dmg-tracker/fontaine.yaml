- id: "clorinde-impale-ability"
  entity: "clorinde"
  rule: "S4"
  status: completed
  category: "bug"
  summary: >
    Impale the Night damage is tagged as Elemental Skill DMG, but the talent text says damage
    dealt during Hunter's Vigil is considered Normal Attack DMG. This makes normal-attack buffs
    miss the lunge and skill-only buffs apply when they should not.
  detail: >
    Retagged the three Impale the Night hits (E param7) in clorinde-normal from
    normalSkillTag to normalBaseTag (Electro/normal/none), so P1/C2's
    ["normal", "burst"] ScalingBuff now reaches the lunge and skill-only buffs
    no longer do. The Arkhe Surging Blade formula keeps normalSkillTag — it is
    genuinely Skill DMG. Added a code comment citing 「上述方式造成的伤害视为
    普通攻击造成的伤害」.

- id: "emilie-c6-charged-formula"
  entity: "emilie"
  rule: "S7"
  status: completed
  category: "missing-formula"
  summary: >
    C6 converts both Normal and Charged Attack DMG to Dendro and adds ATK-scaling base damage,
    but only the Normal Attack sequence has a C6 formula. The charged attack variant is missing.
  detail: >
