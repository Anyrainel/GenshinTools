- id: "furina-q-healing-bonus"
  entity: "furina"
  rule: "U8b"
  status: wont-do
  category: "bug"
  summary: >
    Let the People Rejoice grants both DMG Bonus and Incoming Healing Bonus from Fanfare, but
    the implementation only emits the DMG Bonus. Healing Bonus is a modeled stat and should be
    included with the same Fanfare scaling.
  detail: >
    Rejected 2026-08-13: the claim conflates two different stats. Q param6 is
    「气氛值转化受治疗加成比例」 — Incoming Healing Bonus (受治疗加成), the
    amount of healing a character receives. The engine's heal% key is Healing
    Bonus (治疗加成), the outgoing stat: src/data/i18n-app.ts L53 labels it
    "Healing Bonus"/"治疗加成", it is the circlet main stat in
    src/data/constants.ts L94, and every existing user models outgoing healing
    (Kuki P1, Kaveh C1, Kokomi P4, Ocean-Hued Clam). There is no StatKey for
    Incoming Healing Bonus in src/data/enums.ts.

    Emitting heal% for Furina's Q would therefore not be a missing buff, it
    would be a new bug: heal% feeds Kokomi P2's CrossScalingBuff
    (heal% × 0.15 × HP → baseDmg, character5Inazuma.ts L1043-1070) and
    Everlasting Moonglow's heal% → baseDmg conversion, so a team-wide heal%
    grant from Furina would inflate teammate damage from a stat she does not
    give. Incoming Healing Bonus has no damage path and is correctly skipped
    per U8b's "skip silently: utility and defense buffs".

