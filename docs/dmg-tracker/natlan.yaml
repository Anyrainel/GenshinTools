- id: varesa-c4-mutual-exclusivity
  entity: varesa
  rule: S6
  status: completed
  category: approximation
  summary: >
    C4 mutual exclusivity between Fiery Passion (+100% burst dmg%) and Diligent
    Refinement (+5xATK plunge baseDmg) cannot be cleanly modeled.
  detail: >
    Added CombatOpts with "fiery"/"diligent" choices (both gated behind C4+ via
    when). "fiery" applies +100% burst/plunge dmg%, "diligent" applies +500% ATK
    baseDmg for plunge (cap 20000). Default is "fiery". The two C4 buffs are now
    mutually exclusive instead of both applying simultaneously.
  created: "2026-02-25"
  resolved: "2026-03-08"

