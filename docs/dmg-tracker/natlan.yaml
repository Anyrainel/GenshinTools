- id: ororon-c6-basedmg-filter-too-broad
  entity: ororon
  rule: U5
  status: completed
  category: bug
  summary: >
    C6 Q-triggered Hypersense uses a baseDmg% +1.0 StatBuff with filter
    abilities:["special"], which also applies to the regular P1 Hypersense
    formula (also ability:"special"). At C6, all 8 regular Hypersense hits
    get doubled, not only the single Q-triggered hit. Should be a bespokeBuff
    on the C6 part of ororon-burst only.
  detail: >
    Removed the global C6 baseDmg% StatBuff and re-attached it as a bespokeBuff
    on the C6 Hypersense part of ororon-burst. Only the single Q-triggered
    Hypersense hit is now doubled; the 8 regular ororon-hypersense procs are
    unaffected.

- id: kinich-c1-cd-filter-too-broad
  entity: kinich
  rule: U5
  status: completed
  category: bug
  summary: >
    C1 Scalespiker Cannon CD +100% StatBuff filter abilities:["skill"] also
    applies to Loop Shot (also ability:"skill"). Game text limits this to
