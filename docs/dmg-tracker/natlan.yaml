- id: mavuika-flat-atk-bonus-zone
  entity: mavuika
  rule: U4
  status: completed
  category: bug
  summary: >
    Q Fighting Spirit bonuses and C2 Flamestrider bonuses are merged into
    talentMultiplier. These are flat ATK-based damage increases and should be
    baseDmg-style buffs so baseDmg% effects do not multiply them.
  detail: >
    Fighting Spirit and C2 Flamestrider bonuses are flat ATK-based damage
    increases. They should behave as additive base damage bonuses rather than
    being folded into the talent multiplier zone.
    VERIFIED 2026-08-13: still present. C2 ZH is 「造成的伤害提升，提升值相当于
    玛薇卡攻击力的60%/90%/120%」 and the Q rows are "{paramN:F1P} ATK per
    Fighting Spirit" — both are U4's 「提升值相当于X%某属性」 row, i.e.
    `ScalingBuff("atk", "baseDmg", …)`. character5Natlan.ts L576-L585 folds
    `fsBurst`/`fsNormal`/`fsCharge` and `c2Burst`/`c2Normal`/`c2Charge` into
    each DirectFormula's talentMultiplier, and damageFormula.ts `getBaseDmg`
    computes `talentDmg × (1 + baseDmg%) + flatBaseDmg`, so any external
    baseDmg% ("造成原本X%的伤害") incorrectly scales these flat ATK bonuses.
    The in-code justification comment ("merged … so they use final ATK, not
    preStats ATK") is not valid: `baseDmg` is in FINAL_STAT_KEYS
    (constants.ts L15), so an atk→baseDmg ScalingBuff is a deferred final buff
    (dynamicBuffEval.ts `isDeferredFinalBuff`) and is evaluated against
    post-dynamic midStats ATK — the same path Kinich P2 already uses.
    DONE 2026-08-13. All six merged terms were removed from the formulaMap
    talent multipliers and re-expressed as `ScalingBuff("atk", "baseDmg", …)`
    entries on `receiver: "selfOnField"` with ability filters:
    Q Fighting Spirit → burst/normal/charge at 200 × param(Q,3/4/5), and C2
    Flamestrider → normal 0.6 / charge 0.9 / burst 1.2. External `baseDmg%`
    effects no longer scale these flat ATK bonuses, and the stale "must use
    final ATK" justification comments were removed.

- id: mavuika-c2-def-shred-receiver
  entity: mavuika
  rule: U6
  status: wont-do
  category: approximation
  summary: >
    C2 Ring-form DEF reduction was modeled with receiver:"selfOffField" plus
    receiver:"other" to avoid buffing on-field Flamestrider damage. U6 expects
    DEF reduction to be receiver:"team"; the form split needed a cleaner model.
  detail: >
    Closed as wont-do by maintainer decision: the item proposed an OptionMap
    redesign to pick the Armament form, but the bespokeBuffs route was taken
    instead, so the item's prescription was not followed and Mavuika's single
    option slot stays free. Below C6 the DEF shred is now a bespokeBuff on the
    "mavuika-ring" part (receiver "team", which bespoke merging ignores — only
    the filter is consulted, so U6's receiver constraint does not bind). The
    selfOffField + other split is gone, as is the mavuika/C2 entry in
    CONSTRAINT_ALLOWLIST. From C6 the Flamestrider also summons a Scorching Ring
    with the same -20%, so every form shreds and the buff stays a genuine
    team-wide StatBuff there. Known consequence: below C6 teammates no longer
    receive the Ring-form shred, since bespoke buffs only reach the part they
    are attached to.

    RESOLVED wont-do: the split is intentional, not a U6 violation. Mavuika
    shreds DEF only while carrying the Ring, so "selfOffField" + "other"
    reaches her own off-field Ring damage and every teammate while excluding
    her on-field Flamestrider hits, which carry no Ring below C6. Registered in
    CONSTRAINT_ALLOWLIST as a deliberate exception. A bespokeBuff route was
    tried and reverted: bespoke buffs reach only the part they attach to, so it
    silently dropped the shred for teammates below C6.

- id: kinich-p2-base-dmg-filter-too-broad
  entity: kinich
  rule: U5
  status: completed
  category: bug
  summary: >
    P2 Hunter's Experience is implemented as an uncapped Skill-wide ScalingBuff,
    so it boosts Loop Shot and every Scalespiker Cannon. Game text consumes up
    to two stacks on a Scalespiker Cannon shot only.
  detail: >
    Hunter's Experience consumes up to two stacks on a Scalespiker Cannon shot.
    It should not buff Loop Shot or every Cannon indiscriminately, and the stack
    cap should be respected on the Cannon damage it actually affects.
    VERIFIED 2026-08-13: still present, and it is the largest of the Kinich
    items. P2 ZH is 「基尼奇在施放悬猎·游骋高狩的迴猎贯鳞炮时，将消耗所有的
    「猎人心得」…每层使本次迴猎贯鳞炮造成的伤害…提高」 — one Cannon shot, up to
    2 stacks. The ScalingBuff at character5Natlan.ts L1369-L1376 is
    `receiver: "selfOnField"`, `filter: { abilities: ["skill"] }`, scale 6.4,
    no maxStacks. Loop Shot damage is 「视为元素战技伤害」 so "kinich-loop" is
    correctly tagged `ability: "skill"` and therefore also collects +640% ATK of
    flat baseDmg on both of its hits. It further applies to all 4 Cannons (and
    all 4 C6 bounces) in the combo, which would need 8 Nightsoul Bursts of stack
    regeneration. Correct model: bespokeBuff on the Cannon part (plus the C6
    bounce part, which C6 text does let inherit P2), budgeted per rotation.
    DONE 2026-08-13. The Skill-wide `receiver: "selfOnField"` ScalingBuff was
    removed from Kinich's `buffs` array. P2 is now a bespokeBuff (ScalingBuff
    atk→baseDmg, scale 6.4 = 2 stacks) on the new "kinich-cannon-first" entry:
    on its cannon part and, at C6, on its bounce part. Loop Shot and the other
    three cannons in the rotation no longer receive it. The rotation budget is
    encoded by the combo count split (1 enhanced cannon + 3 plain).

- id: kinich-c2-c6-bounce-stack-limit
  entity: kinich
  rule: U10
  status: wont-do
  category: bug
  summary: >
    Claimed that the shared maxStacks:1 C2 bespoke buff lets the Cannon part
    consume the C6 bounce part's intended bonus. The engine budgets bespoke
    maxStacks per formula part, so both parts already get it.
  detail: >
    WRONG — closed 2026-08-13 after re-reading the engine. Bespoke `maxStacks`
    is not a shared pool: it is resolved per part from that part's own
    `bespokeBuffs` array. See formulaEval.ts L195-L197
    (`bespokeMax = bespokeMaxStacks(part.bespokeBuffs)`;
    `bespokeCutoff = bespokeMax < h ? bespokeMax : h`), the compiler mirror in
    formulaCompiler.ts L580-L587 where `totalHits = h * comboCount`, and
    teamBuild.ts L393-L405 (`buffedHits = min(part.bespokeInfo.maxStacks,
    part.hits * line.count)` computed independently per part). Passing the same
    StatBuff instance into two parts' arrays gives each part its own budget —
    the combo-wide allocator in stackRank.ts only handles ledger buffs with
    `source.maxStacks`, not bespoke overlays. With the current combo
    ("kinich-cannon" count 4), the Cannon part gets the C2 +100% on 1 of 4 and
    the C6 bounce part gets it on 1 of 4, which is exactly the C6 reading:
    the first Cannon and its bounce. No change needed.
    Note: a real defect does live in this same array, but it is the C1 crit DMG
    buff being dragged under the C2 cutoff — tracked in
    kinich-c1-cd-filter-too-broad, not here.

- id: xilonen-converted-samples-distinct-elements
  entity: xilonen
  rule: U12
  status: completed
  category: bug
  summary: >
    Xilonen counts distinct PHEC elements to decide how many Source Samples are
    converted. Game text converts one Geo Sample per Pyro/Hydro/Cryo/Electro
    party member, so duplicate-element teammates can still reach the two-sample
    threshold and activate the matching RES shred.
  detail: >
    Converted Source Samples should count qualifying Pyro/Hydro/Cryo/Electro
    party members, not only distinct elements. Duplicate-element teammates can
    still convert enough samples to activate the matching RES shred.
    VERIFIED 2026-08-13: still present. E ZH is 「队伍中每存在一名火元素、水元素、
    冰元素或雷元素角色，一枚岩元素采样便将转变为对应的元素类型」 — per member,
    capped by the 3 samplers. `convertedSamples` at character5Natlan.ts
    L989-L996 builds a Set of element strings and returns `converted.size`, so a
    double-Pyro team reports 1 converted sample instead of 2. Consequences on
    such teams: the `< 2` branch wrongly grants P1's +30% Normal/Plunge DMG
    (game text gives that only below 2 converted samples) and models the Geo
    shred as `selfOnField` at C0-C1 instead of the team-wide shred the remaining
    Geo sample provides. Note `teamPHEC` (the distinct set used for which
    elements get shred) is separately correct — 「同元素类型「源音采样」的效果
    不能叠加」 — so only the count needs to change, not the shred element list.
    The same per-member vs distinct-element distinction is a live risk in
    Chasca's `eligibleElements`/`shiningCount` (shell conversion is also worded
    per member, while her P1 stack count is genuinely per distinct element).
    DONE 2026-08-13. `convertedSamples` now counts qualifying party MEMBERS,
    capped at the 3 Samplers, instead of returning `Set.size` over distinct
    elements. `teamPHEC` was left as a distinct set (correct — same-element
    samples don't stack) and the surrounding "N PHEC" comments were reworded to
    "N converted". The Chasca risk noted above was checked and confirmed real;
    filed as chasca-shell-count-per-member.

- id: chasca-shell-count-per-member
  entity: chasca
  rule: U12
  status: open
  category: bug
  summary: >
    Chasca converts shells based on the number of distinct eligible elements in
    the team, but game text converts per qualifying party member. A double-Pyro
    team loads fewer Shining Shadowhunt Shells and fewer Radiant Soulseeker
    Shells than it should.
  detail: >
    Found 2026-08-13 while fixing xilonen-converted-samples-distinct-elements.
    E ZH: 「队伍中每存在一名火元素、水元素、冰元素或雷元素角色，一枚「追影弹」便会
    随机转化为对应元素类型之一的「焕光追影弹」」 — per MEMBER, and only shells
    4/5/6 convert, so the base cap is 3. Q ZH: 「队伍中每存在一名火元素…角色，
    两枚索魂弹便将随机转化」 — 2 shells per MEMBER, cap 6.
    character5Natlan.ts derives both counts from `eligibleTypes`, which is the
    size of the distinct-element Set `eligibleElements`:
    `shiningCount = eligibleTypes + (C1 ? 2 : 1)` and
    `qRadiantCount = eligibleTypes * 2`. On a Chasca + 2×Pyro + Hydro team the
    member count is 3 but `eligibleTypes` is 2, so one E shell and two Q shells
    stay unconverted Anemo.
    NOT a bug in the same file: `p1Stacks` is genuinely per distinct element
    (P1 ZH 「依据符合条件的不同元素的数量」), and `eligibleElements` remains the
    right list for spreading converted-shell damage across elements — only the
    counts are wrong. Fix needs a separate member-count field (base conversions
    capped at 3 for E and 6 for Q) while keeping `eligibleElements` distinct,
    plus a decision on how to distribute duplicate-element conversions across
    the shell parts.
