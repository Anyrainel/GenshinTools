- id: mavuika-c6-scorching-ring
  entity: mavuika
  rule: S8
  status: wont-do
  category: missing-formula
  summary: >
    C6 Scorching Ring periodic damage not modeled.
  detail: >
    C6 Scorching Ring deals 500% ATK every 3s while riding Flamestrider. During
    the 7s Q window, ~2 procs = 1000% ATK. Mavuika's total C6 rotation damage is
    very high (Q ~945% + FS baseDmg ~680% + N/CA/Sprint combos + C2 baseDmg procs),
    making the Scorching Ring contribution <5% of total DPS. C6-only, low priority.
  created: "2026-02-25"
  resolved: "2026-03-14"

