- id: iansan-q-atk-scaling-option
  entity: iansan
  rule: S12
  status: wont-do
  category: approximation
  summary: >
    Q Kinetic Energy Scale ATK conversion has two modes (high >=42 NP vs low)
    modeled via OptionMap. However the low-NP option uses a fixed ~27 pts
    estimate. The actual low-NP value ramps based on movement distance and
    nightsoul recovery, making the effective value situational.
  detail: >
    The high-NP mode (>=42 pts) is the preferred and primary option — Iansan
    gains 54 pts from E and 15 from Q, reaching high mode immediately after E+Q.
    The low-NP mode is a brief transitional state. Using ~27 pts as the midpoint
    estimate for the low mode is within acceptable range (~10%) since: (1) most
    rotations use high mode, (2) the low mode is a fallback the user explicitly
    selects, and (3) the actual value is movement-dependent and unknowable without
    gameplay specifics. The approximation is acceptable.
  created: "2026-03-28"
  resolved: "2026-03-28"

- id: kinich-c2-first-cannon-only
  entity: kinich
  rule: S6
  status: completed
  category: bug
  summary: >
    C2 +100% DMG buff is applied to all Scalespiker Cannon shots via a global
    StatBuff, but game text specifies it only applies to the first Scalespiker
    Cannon after entering Nightsoul's Blessing. With combo count: 4, this
    over-counts C2 DMG by ~3x.
  detail: >
    Removed global C2 dmg% StatBuff. Added separate kinich-cannon-first formula
    entry with bespokeBuff for C2 +100% dmg%. Combo descriptor now uses 1x
    first + 3x normal cannon at C2+.
  created: "2026-04-04"
  resolved: "2026-04-04"

- id: mavuika-c2-ring-def-reduction
  entity: mavuika
  rule: S6
  status: completed
  category: approximation
  summary: >
    C2 DEF reduction (-20%) is modeled as always-active, but game text restricts
    it to Ring of Searing Radiance form only. During Flamestrider/Q rotation, the
    Ring is not present so the DEF reduction should not apply to Mavuika's own
    damage. Currently overcounts Mavuika's personal DPS at C2+.
  detail: >
    Changed C2 DEF reduction receiver from "team" to "other". Ring follows the
    active teammate (not Mavuika), so it only buffs teammates' damage. Mavuika's
    own Flamestrider/Q rotation is no longer overcounted.
  created: "2026-04-04"
  resolved: "2026-04-04"

