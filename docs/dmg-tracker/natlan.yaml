- id: citlali-c2-em-receiver
  entity: citlali
  rule: U1
  status: completed
  category: bug
  summary: >
    C2 +250 EM buff uses receiver:"other" but game text "处于白曜护盾的庇护下
    或是伊兹帕帕跟随的其他角色" limits to shielded/followed teammates, which in
    practice means only the active (on-field) teammate. Should use
