- id: kachina-excel-c6-damage
  entity: kachina
  rule: S8
  status: actionable
  category: missing-formula
  summary: >
    Excel shows C6 damage formula (200% DEF as AoE Geo DMG, once per 5s when
    shield is replaced/destroyed). TS has no C6 damage formula. Verify whether
    this is a significant damage source in shield-heavy team compositions.
  detail: >
    Excel source: docs/formulas/原神伤害计算(1).xlsm (VBA module: G岩元素角色模块2.bas).
    Excel formula: (def * talentMultDEF) * (geoDmg + allDmgBonus) * defMult * geoRes.
    TS implementation: No C6 formula present. Game text: "造成相当于她的防御力200%的岩元素范围伤害，该效果5秒内至多触发一次。"
    Model as per tick damage, and guess a default combo count.
  created: "2026-03-22"
  resolved: null

