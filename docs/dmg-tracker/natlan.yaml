- id: kinich-c1-cd-filter-too-broad
  entity: kinich
  rule: U5
  status: completed
  category: bug
  summary: >
    C1 Scalespiker Cannon CD +100% is now scoped away from Loop Shot, but it
    is still attached to the C6 bounce part. C6 only says P2 and C2 Cannon
    buffs carry to the bounce, not the C1 Crit DMG buff.
  detail: >
    DONE 2026-08-13. Split "kinich-cannon" into "kinich-cannon-first" (count 1)
    and "kinich-cannon" (count 3) in character5Natlan.ts, because a bespoke
    overlay is all-or-nothing per part and C1 must apply to every cannon while
    P2/C2 apply only to the first. C1 (cd +100%) is now a bespokeBuff with no
    maxStacks on the cannon part of BOTH entries and is absent from the C6
    bounce parts. This also fixes the inverse defect: at C2+ every cannon now
    keeps the C1 CRIT DMG instead of only the one that won the shared
    maxStacks:1 budget. C2 (+100% dmg%) and P2 now live on the first-cannon
    entry only, with no maxStacks needed since the count split encodes the
    budget.
    (Original guidance below.)
    Loop Shot is fixed, but `cannonBespoke` is reused for both the main
    Scalespiker Cannon part and the C6 bounce. Keep C1 on the Cannon hit only;
    the C6 bounce should inherit P2/C2 effects per C6 text, but not C1.
    VERIFIED 2026-08-13: still present. C6 ZH names only 「焰灵的契约」(P2) and
    「星虎之掌」(C2) as effects the bounce inherits; C1 「迴猎贯鳞炮的暴击伤害
    提升100%」 is not listed, yet `cannonBespoke` (which holds the C1 cd buff) is
    spread into the bounce part's `bespokeBuffs` at character5Natlan.ts L1474.
    Larger inverse defect found in the same code: bespoke `maxStacks` is a
    per-part, all-or-nothing overlay cutoff (formulaEval.ts L195-L200,
    teamBuild.ts L393-L405), and `bespokeMaxStacks()` returns the first
    maxStacks found in the array. Because C1 shares `cannonBespoke` with the
    `maxStacks: 1` C2 buff, at C2+ only 1 of the 4 combo Cannons gets any
    bespoke overlay — Cannons 2-4 silently lose the C1 +100% CRIT DMG they
    should always have. Fix both together: C1 needs its own bespoke entry (no
    maxStacks) on the Cannon part only.

- id: chasca-p1-charge-filter-too-broad
  entity: chasca
  rule: U5
  status: completed
  category: bug
  summary: >
    P1 Spirit of the Radiant Shadow is implemented as a global Charged Attack
    DMG buff, so it also boosts unconverted Shadowhunt Shells. Game text limits
    the 15%/35%/65% bonus to Shining Shadowhunt Shells.
  detail: >
    Spirit of the Radiant Shadow should apply only to Shining Shadowhunt Shell
    damage. Unconverted Shadowhunt Shells should not receive the P1 Charged
    Attack DMG bonus.
    VERIFIED 2026-08-13: still present. P1 ZH is 「使焕光追影弹造成的伤害提升
    15%/35%/65%」 — Shining shells only. The buff at character5Natlan.ts
    L802-L806 is `dmg%` with `filter: { abilities: ["charge"] }`, so it also
    hits the `normalCount` unconverted Anemo shell parts of
    "chasca-shining-volley" (2 shells at 3 eligible elements, C0) and the C2/C4
    400% ATK AoE procs, which are 「视为重击伤害」 but are not Shining shells.
    It does NOT reach "chasca-p2-burning": that part is `offField: true` and the
    buff is `selfOnField`, so the off-field stat sheet drops it.
    DONE 2026-08-13. Removed the Skill-wide P1 StatBuff from Chasca's `buffs`
    array (which is now empty) and re-attached it as a bespokeBuff on the
    Shining Shadowhunt Shell parts of "chasca-shining-volley" only. The
    unconverted Anemo shells and the C2/C4 400% ATK procs no longer receive it.

- id: chasca-c6-cd-filter-too-broad
  entity: chasca
  rule: U5
  status: completed
  category: bug
  summary: >
    C6 Fatal Rounds is implemented as a Charged-Attack-wide Crit DMG buff, so it
    also boosts the C2 and C4 400% ATK AoE procs. Game text limits the +120%
    Crit DMG to the next Multitarget Fire instance's Shadowhunt and Shining
    Shadowhunt Shells.
  detail: >
    Fatal Rounds should apply only to Multitarget Fire's Shadowhunt and Shining
    Shadowhunt Shells. Both shell types are covered by C6 text, so the volley
    shell parts are correct; the leak is to the C2 proc part inside
    "chasca-shining-volley" and the C4 proc parts inside "chasca-burst" — both
    are 「视为重击伤害」 400% ATK AoE instances, not shells, and the C4 ones
    fire during Q rather than Multitarget Fire.
    REVISED 2026-08-13 (was: "also boosts the P2 Burning Shadowhunt Shot").
    That original claim does not hold: "chasca-p2-burning" is `offField: true`
    and the C6 buff is `selfOnField` (character5Natlan.ts L810-L814), so
    off-field stat resolution (fieldState.ts `fieldReq` + teamBuffLedger.ts
    L224) drops the buff for that part in any multi-character team. The
    remaining C2/C4 leak is real but much smaller than the item first claimed.
    DONE 2026-08-13. Removed the Charged-Attack-wide C6 StatBuff from Chasca's
    `buffs` array and re-attached it as a bespokeBuff on both shell part groups
    of "chasca-shining-volley" (unconverted Anemo shells and Shining shells),
    per C6 text covering both shell types. The C2 proc parts there and the C4
    proc parts in "chasca-burst" no longer receive it.

