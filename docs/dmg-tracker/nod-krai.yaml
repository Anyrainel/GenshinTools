# Nod-Krai Damage Tracker
- id: columbina-p2-lunar-procs
  entity: columbina
  rule: S8
  status: wont-do
  category: engine-gap
  summary: >
    P2 conditional 33% proc effects on Lunar reactions not modeled.
  detail: >
    P2 "Law of the New Moon" grants three effects when in Lunar Domain (Q active):
    (1) Lunar-Charged: 33% chance for Thundercloud to perform an extra lightning strike.
    (2) Lunar-Bloom: grants special Moonridge Dew (extra Verdant Dew resource, not damage).
    (3) Lunar-Crystallize: 33% chance for each Moondrift to perform an extra attack.
    Effects (1) and (3) are ~1.33x expected multipliers on Lunar reaction hit output.
    No existing stat key or buff mechanism models probabilistic extra hits on reaction
    instances. Would require new engine feature (reaction hit-count multiplier).

- id: jahoda-excel-missing-eq-formulas
  entity: jahoda
  rule: S8
  status: wont-do
  category: missing-formula
  summary: >
    Excel calculator has E skill (smoke bomb, flask unfilled/filled, meowball
    in 4 elements) and Q burst (initial hit, robot periodic damage in 4
    elements) formulas that are absent from TS formulaMap. Jahoda is modeled
    as a pure healer/support with no damage formulas — verify whether E/Q
    damage sources are significant enough to warrant modeling.
  detail: >
    Jahoda is a 4★ Anemo healer/support. Per rotation (one E + one Q +
    ~6 robot ticks): E filled flask 381.6% ATK + Q initial 373% ATK +
    robot ~186% ATK = ~940% ATK total personal damage. This is negligible
    compared to any main DPS character's rotation output (typically 5000%+).
    Even with P1 Pyro enhancement (robot at 130%), contribution stays well
    under 5% of team DPS. Meowballs (230.4% each, Ascendant Gleam only)
    add marginally but Jahoda is never the damage dealer. Not worth modeling.

- id: illuga-q-shared-stack-pool
  entity: illuga
  rule: U8b
  status: wont-do
  category: engine-gap
  summary: >
    Q Nightingale's Song Geo and LunarCrystallize tiers (and their P2 counterparts) each have
    independent maxStacks: 36, but in-game they share a single pool of 36 stacks. The engine has
    no mechanism to share a stack budget across multiple ScalingBuff instances with different
    reaction filters, so total consumption could theoretically exceed 36 in mixed-reaction combos.
  detail: >
    In practice, Illuga teams are either Geo-focused (using none-reaction Geo hits) or
    LunarCrystallize-focused (with a Hydro teammate for Lunar reactions). Mixed-reaction
    combos where both tiers consume stacks simultaneously are extremely rare in realistic
    team compositions. The theoretical overcounting risk is marginal and does not justify
    engine changes. The current separate-pool modeling is an acceptable approximation.

- id: illuga-q-geo-tier-excludes-lc
  entity: illuga
  rule: U5
  status: wont-do
  category: approximation
  summary: >
    Q Nightingale's Song base Geo tier and P2 base Geo tier use reactions: ["none"] filter,
    excluding LunarCrystallize hits from the base Geo EM→baseDmg bonus. Game text says
    "进一步提升" (further increase) for LC, suggesting base Geo bonus should stack with LC bonus.
  detail: >
    Despite game text "进一步提升" implying additive stacking, in-game testing confirms
    only the higher tier applies — pure Geo gets the lower Geo-tier bonus, LunarCrystallize
    gets the higher LC-tier bonus, but they do not stack. The reactions: ["none"] filter on
    the Geo tier is correct and intentional.

- id: lauma-c6-sanctuary-pale-hymn
  entity: lauma
  rule: U8b
  status: wont-do
  category: engine-gap
  summary: >
    C6 Frostgrove Sanctuary extra LunarBloom hits (8 per duration) should not consume
    Pale Hymn stacks per game text ("不会消耗「苍色祷歌」"), but the engine's maxStacks
    mechanism has no way to exempt specific formula parts from consuming stacks. These
    8 hits currently consume from the shared 36-stack Pale Hymn pool, potentially
    over-depleting stacks meant for other team reactions.
  detail: given lauma DPS is a niche, this is not a priority.

- id: varesa-fp-kick-c4-missing
  entity: varesa
  rule: S9
  status: completed
  category: bug
  summary: >
    C4 clause 2 (+100% DMG when in Fiery Passion or Apex Drive) is applied as bespokeBuff on
    varesa-kablam but missing from varesa-fp-kick. The FP Flying Kick is used during Fiery Passion,
