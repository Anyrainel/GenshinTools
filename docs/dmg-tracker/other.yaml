- id: nicole-q-projection-scaling-element
  entity: nicole
  rule: S10
  status: resolved
  category: engine-gap
  summary: >
    Q Arcane Projection (5×200% ATK) and C1 Unity (600% ATK) now use
    per-slot cross-scaled formulas. Each projection evaluates in the
    triggering teammate's stat context (ATK, element, DMG%, crit, EM)
    via FormulaEntry.statsCharId override.
  detail: >
    Resolved with the statsCharId engine pattern. Nicole's formulaMap
    generates one Q projection + one C1 Unity entry per team slot, each
    with statsCharId set to the slot occupant and DamageTag.element set
    to the occupant's element. The formula lives in Nicole's charBase
    (owner = "nicole") but evaluateCombo/compiler resolve stats from the
    statsCharId character. P4 Hexerei buff routes to occupant via
    { receiver: "team", charId: occupantId }. Game text citation:
    "该伤害受益于该角色的攻击力，并视为由该角色造成的伤害".

- id: prune-q-bell-hit-count
  entity: prune
  rule: S8
  status: open
  category: needs-data
  summary: >
    Q Witchlure Bell Hunter-Seeker tick count is estimated at 4 hits over the
    12s burst duration (15s+ with C6). Game text specifies only "attacking
    surrounding opponents at intervals" without a concrete tick rate; actual
    interval requires in-game verification.
  detail: >
    Per S8, when a periodic proc's exact tick rate is unknown, a best-estimate
    with a code comment is acceptable. The current 4 ticks / 12s (~3s interval)
    estimate is consistent with comparable "summon bell/bird/hunter-seeker"
    mechanics on existing characters (e.g., Yelan Exquisite Throw, Faruzan
    Dazzling Polyhedron cadence). External sources (KQM, HHW, Wiki) do not
    yet cover Prune as she is unreleased beta. Revisit only after official release.
