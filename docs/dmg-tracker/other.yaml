- id: aloy-e-freeze-bomb
  entity: aloy
  rule: S8
  status: wont-do
  category: missing-formula
  summary: >
    E Freeze Bomb / Chillwater Bomblet hits not modeled.
  detail: >
    Aloy is not in DmgRunbook. She is a collab-exclusive 5-star with no
    constellations. E Freeze Bomb is 320% at Lv10 and Chillwater Bomblets are
    72% each with variable hit count (random scatter). Aloy is an extremely
    niche character with near-zero usage rate. Estimated <5% of any realistic
    team DPS contribution. Not worth modeling.
  created: "2026-02-25"
  resolved: "2026-02-26"

- id: traveler-hydro-e-dewdrop
  entity: traveler_hydro
  rule: S8
  status: wont-do
  category: missing-formula
  summary: >
    E hold mode Dewdrop hits (59% per hit, up to 6s) not modeled.
  detail: >
    Traveler Hydro is not in DmgRunbook. Dewdrop hits are 59%/69.7% per hit
    (Lv10/Lv13) over up to 6s hold duration. Traveler Hydro is primarily a
    utility/self-sustain character, not a DPS. The hold mode locks the
    character in place and is rarely used for damage. The E Torrent Surge
    (340.7%/402.2%) is already modeled. Estimated <5% of any team DPS
    contribution from Dewdrops.
  created: "2026-02-25"
  resolved: "2026-02-26"

