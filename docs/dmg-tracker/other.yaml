- id: traveler-pyro-e-hold
  entity: traveler_pyro
  rule: S8
  status: wont-do
  category: missing-formula
  summary: >
    E hold mode (Hold DMG 177.8% + Scorching Threshold coordinated attack 146.6% per 3s)
    not modeled. Hold mode deals more total damage than tap mode over the skill duration.
  detail: >
    Traveler Pyro is primarily an off-field Pyro support. Total personal damage per
    rotation: tap E 606% + Q 769% = 1375% ATK; hold E 764% + Q 769% = 1533% ATK.
    The hold mode adds ~158% ATK (~11% more personal damage). For a support character
    whose value is in C1 dmg% buff and Pyro application, personal damage is well under
    5% of any realistic team DPS. The missing hold formula does not meet the significance
    threshold. Additionally, tap mode (Blazing Threshold, proximity-based) is the more
    commonly used mode per standard rotations since hold mode requires the active character
    to hit enemies to trigger coordinated attacks, adding a gameplay dependency.
  created: "2026-03-29"
  resolved: "2026-03-29"

