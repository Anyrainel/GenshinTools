- id: baizhu-c6-extra-spiritveins
  entity: baizhu
  rule: S7
  status: completed
  category: missing-formula
  summary: >
    C6 shield generation from Gossamer Sprite and Gossamer Sprite: Splice hits is not
    reflected as extra Spiritvein damage. The implementation only adds the C6 8% Max HP
    bonus to existing Spiritvein hits.
  detail: >
    Added the C2 Splice to the rotation (baizhu-c2-sprite count 0, bonus minC 2
    delta 2 → 2 splices) and added a C6 bonus to baizhu-burst (count 3, bonus
