- id: lan_yan-p1-absorption-dead
  entity: lan_yan
  rule: S10
  status: wont-do
  category: engine-gap
  summary: >
    P1 absorption damage is modeled as baseDmg% buffs with element filter, but no
    absorbed-element formula exists. All E formulas are Anemo, so the element-scoped
    buffs never activate. The 50% additional elemental DMG per absorbed element is
    effectively not modeled.
  detail: >
    Element absorption formula — the absorbed element depends on in-game aura priority
    (Pyro > Hydro > Electro > Cryo) and enemy state, not team composition. Picking a
    team element would produce incorrect results when multiple absorbable elements are
    present. Requires a user-selectable absorption element (engine feature). The existing
    dead-code baseDmg% buffs are harmless since no absorbed-element formula activates them.
  created: "2026-03-28"
  resolved: "2026-03-29"

