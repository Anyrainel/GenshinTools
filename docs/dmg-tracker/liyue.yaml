- id: shenhe-c4-skyfrost
  entity: shenhe
  rule: S5
  status: wont-do
  category: engine-gap
  summary: >
    C4 Skyfrost Mantra (5% E DMG per Icy Quill trigger consumed by teammates, max 50 stacks)
    not implemented. Requires cross-character stack consumption tracking.
  detail: >
    Requires engine feature: runtime tracking of Icy Quill consumption across all teammates
    to count Skyfrost Mantra stacks. The engine has no cross-character stack consumption
    counter. Shenhe's personal E damage is minor relative to her team buff value (she is a
    pure Cryo support), so even at max 50 stacks (+250% E DMG), the impact on total team DPS
    is negligible. Not worth the complexity for this use case.
  created: "2026-03-22"
  resolved: "2026-03-28"

