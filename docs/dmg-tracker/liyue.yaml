# Liyue Damage Tracker

- id: xinyan-e-q-dot
  entity: xinyan
  rule: S8
  status: wont-do
  category: missing-formula
  summary: >
    E DoT (60.5%) and Q Pyro DoT (72%) not modeled.
  detail: >
    Xinyan is not in DmgRunbook. E DoT (60.5%/71.4%) requires Level 3 shield (hitting 3+ enemies
    or 2+ with P1), ticks intermittently over 12s — very low multiplier. Q Pyro DoT (72%/85%)
    lasts only 2s, negligible vs the 613% Physical burst hit. Both are periodic/minor procs,
    estimated <5% DPS contribution combined.

- id: xiao-p1-ramp
  entity: xiao
  rule: S6
  status: wont-do
  category: approximation
  summary: >
    P1 ramp approximated as 15% average; true max 25% at 15s.
  detail: >
    Time-dependent ramp averaged for steady-state DPS calculation.

- id: shenhe-c4-skyfrost
  entity: shenhe
  rule: S5
  status: wont-do
  category: engine-gap
  summary: >
    C4 Skyfrost Mantra (5% E DMG per Icy Quill trigger consumed by teammates, max 50 stacks)
    not implemented. Requires cross-character stack consumption tracking.
  detail: >
    Requires engine feature: runtime tracking of Icy Quill consumption across all teammates
    to count Skyfrost Mantra stacks. The engine has no cross-character stack consumption
    counter. Shenhe's personal E damage is minor relative to her team buff value (she is a
    pure Cryo support), so even at max 50 stacks (+250% E DMG), the impact on total team DPS
    is negligible. Not worth the complexity for this use case.

- id: xingqiu-c4-wrong-zone
  entity: xingqiu
  rule: U4
  status: wont-do
  category: bug
  summary: >
    C4 "画雨笼山造成的伤害提升50%" uses baseDmg% but should use dmg%. The game text
    "造成的伤害提升X%" maps to the dmg% zone per U4.
  detail: >
    baseDmg% is intentional: early character wording uses 伤害提升 but in-game testing
    confirms baseDmg% behavior, not dmg%. Code comment added.

- id: beidou-c4-proc
  entity: beidou
  rule: S8
  status: wont-do
  category: missing-formula
  summary: >
    C4 additional 20% ATK Electro DMG on Normal Attacks (after being attacked, 10s) not modeled.
    Low priority since Beidou is primarily a Q sub-DPS.
  detail: >
    Being attacked is hard to reliably trigger in combat, and we usually ignore the effect.

- id: baizhu-p1-hp-option
  entity: baizhu
  rule: S6
  status: wont-do
  category: bug
  summary: >
    P1 Dendro DMG +25% is conditional on the active character's HP >= 50%, but the
    buff is hardcoded as always-on without an OptionMap. Per S6, HP-state conditions
    require an OptionMap with explicit HP tiers.
  detail: >
    baizhu is a healer, keeping active character above 50% HP is very common and easy.

- id: lan_yan-p1-absorption-dead
  entity: lan_yan
  rule: S10
  status: wont-do
  category: engine-gap
  summary: >
    P1 absorption damage is modeled as baseDmg% buffs with element filter, but no
    absorbed-element formula exists. All E formulas are Anemo, so the element-scoped
    buffs never activate. The 50% additional elemental DMG per absorbed element is
    effectively not modeled.
  detail: >
    Element absorption formula — the absorbed element depends on in-game aura priority
    (Pyro > Hydro > Electro > Cryo) and enemy state, not team composition. Picking a
    team element would produce incorrect results when multiple absorbable elements are
    present. Requires a user-selectable absorption element (engine feature). The existing
    dead-code baseDmg% buffs are harmless since no absorbed-element formula activates them.

- id: xiangling-pepper-pickup
  entity: xiangling
  rule: U1
  status: wont-do
  category: engine-gap
  summary: >
    P2 chili pepper pickup grants ATK +10% to the single character who picks it up,
    but receiver is "teamOnField" which applies to whoever is active at hit time.
    Engine lacks persistent single-character pickup buff tracking.
  detail: >
    This approximation is acceptable for now.

- id: chongyun-p1-weapon-filter
  entity: chongyun
  rule: U1
  status: actionable
  category: engine-gap
  summary: >
    P1 Normal ATK SPD +8% is limited to Sword/Claymore/Polearm users in the Chonghua
    Frost Field, but the buff applies to all active teammates because BuffTarget has
    no weaponTypes filter. Catalyst/bow teammates incorrectly receive the atkSpd buff.
  detail: >
    Modify the buffs to target specific charId based on Sword/Claymore/Polearm.

- id: zhongli-press-formula
  entity: zhongli
  rule: S8b
  status: actionable
  category: missing-formula
  summary: >
    E Press mode (stele creation only) has no formula. Only Hold is modeled via
    "zhongli-hold" (hold AoE + stele creation). Per S8b, 5★ E should expose both
    tap and hold modes as separate formulas.
  detail: >
    Should add additional formulas for tap E. But the resonance DMG formula should be 
    modeled as a separate formula.
