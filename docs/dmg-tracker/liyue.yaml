- id: baizhu-q-hit-count
  entity: baizhu
  rule: S6
  status: wont-do
  category: missing-formula
  summary: >
    Q Spiritvein hit count depends on incoming damage; approximated as x6.
  detail: >
    Baizhu is a Dendro healer/support not in DmgRunbook. Q Pulsing Clarity lasts 14s,
    generating a new Seamless Shield every 2.5s (~5 refreshes). Spiritveins fire when a
    new shield is generated while old one is active, or when a shield breaks/expires. The
    x6 approximation is within acceptable range for typical combat scenarios. Shield breaks
    from incoming damage may add 1-2 extra procs but this is highly variable and Baizhu's
    personal DPS is not a primary concern.
  created: "2026-02-25"
  resolved: "2026-02-26"

