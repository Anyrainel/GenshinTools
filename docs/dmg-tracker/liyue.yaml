# Liyue Damage Tracker

- id: xinyan-e-q-dot
  entity: xinyan
  rule: S8
  status: wont-do
  category: missing-formula
  summary: >
    E DoT (60.5%) and Q Pyro DoT (72%) not modeled.
  detail: >
    Xinyan is not in DmgRunbook. E DoT (60.5%/71.4%) requires Level 3 shield (hitting 3+ enemies
    or 2+ with P1), ticks intermittently over 12s — very low multiplier. Q Pyro DoT (72%/85%)
    lasts only 2s, negligible vs the 613% Physical burst hit. Both are periodic/minor procs,
    estimated <5% DPS contribution combined.

- id: xiao-p1-ramp
  entity: xiao
  rule: S6
  status: wont-do
  category: approximation
  summary: >
    P1 ramp approximated as 15% average; true max 25% at 15s.
  detail: >
    Time-dependent ramp averaged for steady-state DPS calculation.

- id: shenhe-c4-skyfrost
  entity: shenhe
  rule: S5
  status: wont-do
  category: engine-gap
  summary: >
    C4 Skyfrost Mantra (5% E DMG per Icy Quill trigger consumed by teammates, max 50 stacks)
    not implemented. Requires cross-character stack consumption tracking.
  detail: >
    Requires engine feature: runtime tracking of Icy Quill consumption across all teammates
    to count Skyfrost Mantra stacks. The engine has no cross-character stack consumption
    counter. Shenhe's personal E damage is minor relative to her team buff value (she is a
    pure Cryo support), so even at max 50 stacks (+250% E DMG), the impact on total team DPS
    is negligible. Not worth the complexity for this use case.

- id: xingqiu-c4-wrong-zone
  entity: xingqiu
  rule: U4
  status: wont-do
  category: bug
  summary: >
    C4 "画雨笼山造成的伤害提升50%" uses baseDmg% but should use dmg%. The game text
    "造成的伤害提升X%" maps to the dmg% zone per U4.
  detail: >
    baseDmg% is intentional: early character wording uses 伤害提升 but in-game testing
    confirms baseDmg% behavior, not dmg%. Code comment added.

- id: beidou-c4-proc
  entity: beidou
  rule: S8
  status: wont-do
  category: missing-formula
  summary: >
    C4 additional 20% ATK Electro DMG on Normal Attacks (after being attacked, 10s) not modeled.
    Low priority since Beidou is primarily a Q sub-DPS.
  detail: >
    Being attacked is hard to reliably trigger in combat, and we usually ignore the effect.

- id: baizhu-p1-hp-option
  entity: baizhu
  rule: S6
  status: wont-do
  category: bug
  summary: >
    P1 Dendro DMG +25% is conditional on the active character's HP >= 50%, but the
    buff is hardcoded as always-on without an OptionMap. Per S6, HP-state conditions
    require an OptionMap with explicit HP tiers.
  detail: >
    baizhu is a healer, keeping active character above 50% HP is very common and easy.

- id: lan_yan-p1-absorption-dead
  entity: lan_yan
  rule: S10
  status: wont-do
  category: engine-gap
  summary: >
    P1 absorption damage is modeled as baseDmg% buffs with element filter, but no
    absorbed-element formula exists. All E formulas are Anemo, so the element-scoped
    buffs never activate. The 50% additional elemental DMG per absorbed element is
    effectively not modeled.
  detail: >
    Element absorption formula — the absorbed element depends on in-game aura priority
    (Pyro > Hydro > Electro > Cryo) and enemy state, not team composition. Picking a
    team element would produce incorrect results when multiple absorbable elements are
    present. Requires a user-selectable absorption element (engine feature). The existing
    dead-code baseDmg% buffs are harmless since no absorbed-element formula activates them.

- id: xiangling-pepper-pickup
  entity: xiangling
  rule: U1
  status: wont-do
  category: engine-gap
  summary: >
    P2 chili pepper pickup grants ATK +10% to the single character who picks it up,
    but receiver is "teamOnField" which applies to whoever is active at hit time.
    Engine lacks persistent single-character pickup buff tracking.
  detail: >
    This approximation is acceptable for now.

- id: lan_yan-c1-extra-ring
  entity: lan_yan
  rule: S7
  status: wont-do
  category: missing-formula
  summary: >
    C1 adds another Feathermoon Ring after P1 elemental absorption, but E damage remains
    one ring and does not include the extra C1 ring hit.
  detail: >
    The extra ring is tied to the same absorbed-element path that is intentionally
    unmodeled for Lan Yan P1. Without a reliable absorption selection, adding this
    C1 hit would depend on the same unsupported aura-priority decision.

- id: xingqiu-burst-sword-rain-count
  entity: xingqiu
  rule: S7
  status: completed
  category: needs-data
  summary: >
    Raincutter sword rain is modeled as one Sword Rain DMG hit per proc. The implementation
    does not model the multi-sword wave pattern or C6's enhanced third wave, so burst damage
    is undercounted.
  detail: >
    Raised the xingqiu-burst-tick comboDescriptor count from 15 to 21 sword rain
    hits to reflect the multi-sword wave pattern over a full Q (best-estimate,
    matches community/KQM full-uptime models). Added a C6 bonus (+6 hits) for the
    enhanced third-wave swords via bonus: [{ minC: 6, delta: 6 }]. Documented the
    estimate in a code comment. type-check passes.

- id: yaoyao-c6-mega-radish-count
  entity: yaoyao
  rule: S3
  status: completed
  category: bug
  summary: >
    C6 Mega Radishes are additional throws, but the E formula replaces two normal White
    Jade Radish hits by reducing regular hits from 10 to 8.
  detail: >
    Changed the yaoyao-skill normal White Jade Radish part from
    (constellation >= 6 ? 8 : 10) hits to a constant 10 hits, so the 2 C6 Mega
    Radish hits (75% ATK Dendro) are now genuinely additional rather than
    replacing normal throws. type-check passes.

- id: yaoyao-p1-starscatter-radishes
  entity: yaoyao
  rule: S7
  status: completed
  category: missing-formula
  summary: >
    P1 Starscatter radishes during Moonjade Descent are not modeled. While Yaoyao is
    running, sprinting, or jumping in Q, she can throw one extra White Jade Radish every
    0.6s.
  detail: >
    Added a third part to yaoyao-burst: 8 extra Adeptal Legacy White Jade Radish
    hits (this.param("Q", 1), Dendro burst, offField) representing P1 Starscatter
    throws over the ~5s Q while moving. Documented the estimate in a code comment.
    type-check passes.

- id: ningguang-charged-star-jades
  entity: ningguang
  rule: S7
  status: completed
  category: missing-formula
  summary: >
    Ningguang has no Charged Attack or Star Jade formula even though her kit and C6
    explicitly support Charged Attack damage.
  detail: >
    Added ningguang-charge formula: Charged Attack hit (this.param("A", 2), Geo
    charge) plus Star Jades (this.param("A", 3)) as a hits: N part. Star Jade count
    is 7 at C6 (Q grants 7), else 3 (modeling a typical Normal Attack build-up,
    documented in a code comment). Added the formula to comboDescriptor (count 1).
    type-check passes.

- id: baizhu-c2-splice-hit-count
  entity: baizhu
  rule: S3
  status: completed
  category: bug
  summary: >
    C2 Gossamer Sprite: Splice is modeled as 3 hits, but the constellation text says
    it initiates 1 attack before returning.
