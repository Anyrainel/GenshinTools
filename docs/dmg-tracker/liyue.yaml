- id: shenhe-c4-skyfrost
  entity: shenhe
  rule: S5
  status: open
  category: engine-gap
  summary: >
    C4 Skyfrost Mantra (5% E DMG per Icy Quill trigger consumed by teammates, max 50 stacks)
    not implemented. Requires cross-character stack consumption tracking.
  detail: >
    KQM source: https://keqingmains.com/shenhe/.
    C4 grants Shenhe a Skyfrost Mantra stack each time any teammate triggers Icy Quill's DMG
    bonus. On next E cast, all stacks are consumed for +5% DMG each (max 50 = +250%). This
    requires runtime tracking of Icy Quill consumption across all teammates, which the current
    engine does not support. Shenhe's personal E damage is minor relative to her team buff
    value, so impact is low.
  created: "2026-03-22"
  resolved: null

- id: chongyun-c6-enemy-hp
  entity: chongyun
  rule: S6
  status: wont-do
  category: engine-gap
  summary: >
    C6 Q +15% DMG vs enemies with lower HP% than Chongyun is assumed always-active. Relative HP
    comparison is hard to model with standard OptionMap.
  detail: >
    Requires comparing enemy HP% to character HP%, which is a relative comparison not
    supported by OptionMap (which only models absolute thresholds like "below 50%"). Adding
    this would require a new engine concept for relative HP state. The always-active assumption
    is acceptable because Chongyun Q is typically used as a burst nuke on enemies already
    damaged, where the condition is naturally satisfied. The 15% dmg% buff on a 4-star C6 Q
    is not worth the engine complexity.
  created: "2026-02-26"
  resolved: "2026-02-26"
