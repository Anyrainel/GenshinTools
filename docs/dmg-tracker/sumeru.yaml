# Sumeru Damage Tracker

- id: candace-c6-overflow
  entity: candace
  rule: S8
  status: wont-do
  category: missing-formula
  summary: >
    C6 The Overflow wave (15% HP Hydro, every 2.3s) not modeled.
  detail: >
    No runbook formulas for Candace. C6-only coordinated attack for a niche
    support character. Periodic/minor proc, estimated <5% team DPS contribution.

- id: nilou-c1-dmg-zone
  entity: nilou
  rule: U4
  status: wont-do
  category: bug
  summary: >
    C1 Luminous Illusion DMG +65% uses baseDmg% but game text says "伤害提升65%"
    which maps to dmg% (damage bonus zone), not baseDmg% (talent multiplier zone).
  detail: >
    baseDmg% is correct. The wording "[attack]造成的伤害提升X%" is confirmed by
    KQM TCL as Base DMG Multiplier (baseDmg%), not DMG Bonus (dmg%). Reverted
    the change back to baseDmg%.

- id: sethos-dusk-bolt-missing-atk
  entity: sethos
  rule: S2
  status: completed
  category: approximation
  summary: >
    Q Dusk Bolt formula uses scalingKey "em" only, but Dusk Bolts are converted
    Normal Attacks whose damage should include Normal ATK multiplier × ATK plus
    Q EM-based increase. The ATK-scaling component is missing.
  detail: >
    Switched scalingKey to "atk" with talent multiplier this.param("A", 1) (N1)
    and added an extraTerm of EM × this.param("Q", 1) so Dusk Bolt = N1% × ATK +
    Q-EM scaling, matching the in-game NA-conversion mechanic.

- id: alhaitham-p2-filter-too-broad
  entity: alhaitham
  rule: U5
  status: completed
  category: bug
  summary: >
    P2 "EM × 0.1% → DMG%" buff filters abilities:["skill","burst"] but game text
    restricts it to Projection Attacks and Q only, not the E Rush initial hit.
    The E Rush formula currently receives the bonus incorrectly.
  detail: >
    Removed the shared P2 ScalingBuff from buffs[]; created two ScalingBuff
    instances (skill-filter and burst-filter) and attached them as bespokeBuffs to
    alhaitham-projection and alhaitham-burst respectively. alhaitham-rush no
    longer receives the bonus.

- id: dehya-c2-missing-maxstacks
  entity: dehya
  rule: U8b
  status: completed
  category: bug
  summary: >
    C2 "下次协同攻击造成的伤害提升50%" buff applies to all 4 Molten Inferno field
    hits in the rotation, but game text limits it to the NEXT coordinated attack
    only. The buff is missing maxStacks: 1.
  detail: >
    Spread maxStacks: 1 onto the BuffSource (cbs result) for the C2 StatBuff so
    only one E field hit per rotation receives the +50% DMG.

- id: nahida-p2-q-pyro-scope
  entity: nahida
  rule: U5
  status: completed
  category: approximation
  summary: >
    P2 (EM → dmg%/CR on Tri-Karma) and Q Pyro-resonance DMG bonus use filter
    abilities:["skill"] which also applies to E Press and E Hold initial hits.
    Game text restricts these bonuses to Tri-Karma Purification only.
  detail: >
    Removed the skill-filtered P2 ScalingBuffs and Q Pyro-resonance StatBuff from
    buffs[]; built a triKarmaBespoke list of those buffs (no ability filter,
    receiver:"self") and attached it via bespokeBuffs on nahida-karma and
    nahida-c6-karma. nahida-press / nahida-hold no longer receive the bonuses.
