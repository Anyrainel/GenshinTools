# Sumeru Damage Tracker

- id: candace-c6-overflow
  entity: candace
  rule: S8
  status: wont-do
  category: missing-formula
  summary: >
    C6 The Overflow wave (15% HP Hydro, every 2.3s) not modeled.
  detail: >
    No runbook formulas for Candace. C6-only coordinated attack for a niche
    support character. Periodic/minor proc, estimated <5% team DPS contribution.

- id: nilou-c1-dmg-zone
  entity: nilou
  rule: U4
  status: wont-do
  category: bug
  summary: >
    C1 Luminous Illusion DMG +65% uses baseDmg% but game text says "伤害提升65%"
    which maps to dmg% (damage bonus zone), not baseDmg% (talent multiplier zone).
  detail: >
    baseDmg% is correct. The wording "[attack]造成的伤害提升X%" is confirmed by
    KQM TCL as Base DMG Multiplier (baseDmg%), not DMG Bonus (dmg%). Reverted
    the change back to baseDmg%.

- id: candace-q-p2-element-scope
  entity: candace
  rule: U5
  status: completed
  category: bug
  summary: >
    Q Prayer of the Crimson Crown and P2 both buff all Normal Attack damage, but
    game text restricts them to Normal Attacks that deal Elemental DMG.
    Physical Normal Attack damage currently receives the bonus incorrectly.
  detail: >
    Added elements filter (all 7 non-Physical elements) to both the Q dmg% and
    P2 ScalingBuff teamOnField buffs, keeping receiver:"teamOnField" and
    abilities:["normal"]. Physical Normal Attacks no longer receive the bonus.

- id: faruzan-p2-receiver
  entity: faruzan
  rule: U1
  status: completed
  category: bug
  summary: >
    P2 Hurricane Guard uses receiver:"teamOnField", but game text grants the
    flat Anemo damage increase to characters affected by Q's Prayerful Wind's
    Benefit, not only the current active character. Off-field Anemo damage from
    affected teammates misses the buff.
  detail: >
    Changed P2 ScalingBuff receiver from "teamOnField" to "team", keeping the
    existing Anemo element and ability filters. Off-field Anemo damage from
    affected teammates now receives the flat baseDmg buff.

- id: faruzan-q-pulse-formula
  entity: faruzan
  rule: S7
  status: wont-do
  category: missing-formula
  summary: >
    Q Whirlwind Pulse damage is not modeled. The implementation has Q buffs but
    no formula for the initial and subsequent Dazzling Polyhedron pulses.
  detail: >
    Faruzan is primarily an Anemo support, and Q pulse damage is minor compared
    with the carry damage enabled by her buffs. The exact later-pulse count also
    depends on burst movement and rotation assumptions, so this does not meet the
    significance threshold for adding a missing formula.

- id: faruzan-c6-collapse-formula
  entity: faruzan
  rule: S7
  status: completed
  category: missing-formula
  summary: >
    C6 applies Pressurized Collapse when the active character deals damage under
    Prayerful Wind's Benefit, but the resulting Anemo Skill DMG proc is not
    modeled.
  detail: >
    Added "faruzan-c6-collapse" formula (minC: 6) using DirectFormula with
    this.param("E", 2) and the Anemo/skill/none tag (same multiplier as the E
    vortex). Added it to comboDescriptor with a minC:6 +1 bonus (1 proc per
    rotation when C6 is unlocked).

- id: alhaitham-lower-mirror-variants
  entity: alhaitham
  rule: S8
  status: completed
  category: missing-formula
  summary: >
    Only the 3-Mirror Projection Attack and 3-Mirror burst case are modeled.
    Alhaitham is a 5-star character, so the 1-Mirror and 2-Mirror Projection
    Attack damage rows and lower-mirror burst instance variants should also be
    represented.
  detail: >
    Added "alhaitham-projection-1" (E params 4/5, hits 1) and
    "alhaitham-projection-2" (E params 6/7, hits 2), both with the p2Skill
    bespokeBuff. Added burst variants "alhaitham-burst-0/1/2" using
    this.param("Q", 3/4/5) as the hit count; converted the existing 3-Mirror
    burst to use this.param("Q", 6). All carry the p2Burst bespokeBuff.
    comboDescriptor still uses the 3-Mirror projection/burst for the default
    rotation; lower-mirror variants are available for selection.

- id: cyno-c2-twr-sc-receiver
  entity: cyno
  rule: U1
  status: wont-do
  category: approximation
  summary: >
    C2 Radiance Stellar-Conduct DMG +16%×5 is modeled with receiver "team", but
    game text limits the buff to characters affected by Together We Rise (Cyno
    and the character who inherits it on swap), not the whole party at once.
  detail: >
    Together We Rise inheritance is swap-order dependent (cross-character runtime
    state). Narrowing C2 SC stacks to Cyno plus the swap partner requires engine
    swap tracking not available in current patterns. Team receiver is an acceptable
    peak approximation for SC-team damage modeling where rotation members dealing
    SC damage are assumed TWR-affected; off-field over-buff on non-SC dealers is
    negligible.

- id: cyno-c6-jackal-proc-count
  entity: cyno
  rule: S8
  status: completed
  category: approximation
  summary: >
    C6 Day of the Jackal Starsame uses comboDescriptor count 6 with hits 5
    (30 bolt procs per burst), exceeding the 4–8 stack cap and 0.4s ICD from
    game text.
  detail: >
    Reduced C6 bolt procs to 8 hits × combo count 1 (max stack cap per
    Pathclearer) for both cyno-c6-bolts and cyno-c6-starsame, replacing 6×5=30.

- id: wanderer-c4-hydro-electro-random-buff
  entity: wanderer
  rule: U9
  status: completed
  category: bug
  summary: >
    C4's extra random untriggered P1 buff is omitted when the team only enables
    Hydro and/or Electro contact. In those cases C4 can still grant an
    untriggered offensive Pyro or Cryo buff, but the implementation grants
    neither.
  detail: >
    Reworked the C4 gate: P1 now triggers when any of Hydro/Pyro/Cryo/Electro is
    contacted (p1Triggered), and C4 (c4Active) adds the best missing offensive
    buff under peak-damage — Pyro ATK% if Pyro not contacted, else Cryo CR. The
    Hydro/Electro-only case now correctly grants the Pyro ATK% buff. Existing
    Pyro-only/Cryo-only/both cases are preserved.

- id: kaveh-normal-attack-formula
  entity: kaveh
  rule: S7
  status: completed
  category: missing-formula
  summary: >
    Kaveh's Normal/Charged Attack damage (Dendro-infused during Q) is not
    modeled, despite his kit explicitly buffing these attacks (P2 EM per N/C/P
    hit, C2 Normal ATK SPD +15%, C6 Pairidaeza proc on N/C/P hit).
  detail: >
    Added "kaveh-normal" (N1-N4 via this.param("A", 1..4), four parts) and
    "kaveh-charge" (cyclic this.param("A", 5) hits:2 + final this.param("A", 6)),
    all Dendro/normal|charge tags modeled in the Q-infused state (S10 infusion
    exception). Added kaveh-normal (count 2) to comboDescriptor and gave
    kaveh-c6-pairidaeza a minC:6 +2 bonus so it procs off the new N/C/P hits.
    Existing P2 EM, C2 atkSpd, and C6 buffs land on these formulas.
    File: character4Sumeru.ts.
