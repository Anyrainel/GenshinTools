# Sumeru Damage Tracker

- id: candace-c6-overflow
  entity: candace
  rule: S8
  status: wont-do
  category: missing-formula
  summary: >
    C6 The Overflow wave (15% HP Hydro, every 2.3s) not modeled.
  detail: >
    No runbook formulas for Candace. C6-only coordinated attack for a niche
    support character. Periodic/minor proc, estimated <5% team DPS contribution.

- id: nilou-c1-dmg-zone
  entity: nilou
  rule: U4
  status: wont-do
  category: bug
  summary: >
    C1 Luminous Illusion DMG +65% uses baseDmg% but game text says "伤害提升65%"
    which maps to dmg% (damage bonus zone), not baseDmg% (talent multiplier zone).
  detail: >
    baseDmg% is correct. The wording "[attack]造成的伤害提升X%" is confirmed by
    KQM TCL as Base DMG Multiplier (baseDmg%), not DMG Bonus (dmg%). Reverted
    the change back to baseDmg%.

- id: candace-q-p2-element-scope
  entity: candace
  rule: U5
  status: actionable
  category: bug
  summary: >
    Q Prayer of the Crimson Crown and P2 both buff all Normal Attack damage, but
    game text restricts them to Normal Attacks that deal Elemental DMG.
    Physical Normal Attack damage currently receives the bonus incorrectly.
  detail: >
    Keep receiver:"teamOnField" and abilities:["normal"], but scope the buff to
    elemental damage only (all elements except Physical).

- id: faruzan-p2-receiver
  entity: faruzan
  rule: U1
  status: actionable
  category: bug
  summary: >
    P2 Hurricane Guard uses receiver:"teamOnField", but game text grants the
    flat Anemo damage increase to characters affected by Q's Prayerful Wind's
    Benefit, not only the current active character. Off-field Anemo damage from
    affected teammates misses the buff.
  detail: >
    Use a team-wide receiver with the existing Anemo and ability filters; Q's
    Prayerful Wind's Benefit is applied to all nearby party members.

- id: faruzan-q-pulse-formula
  entity: faruzan
  rule: S7
  status: wont-do
  category: missing-formula
  summary: >
    Q Whirlwind Pulse damage is not modeled. The implementation has Q buffs but
    no formula for the initial and subsequent Dazzling Polyhedron pulses.
  detail: >
    Faruzan is primarily an Anemo support, and Q pulse damage is minor compared
    with the carry damage enabled by her buffs. The exact later-pulse count also
    depends on burst movement and rotation assumptions, so this does not meet the
    significance threshold for adding a missing formula.

- id: faruzan-c6-collapse-formula
  entity: faruzan
  rule: S7
  status: actionable
  category: missing-formula
  summary: >
    C6 applies Pressurized Collapse when the active character deals damage under
    Prayerful Wind's Benefit, but the resulting Anemo Skill DMG proc is not
    modeled.
  detail: >
    Add a C6-gated Anemo/Skill formula for the Pressurized Collapse vortex using
    the E vortex multiplier this.param("E", 2). The trigger is shared party-wide
    and can occur once every 3s.

- id: alhaitham-lower-mirror-variants
  entity: alhaitham
  rule: S8
  status: actionable
  category: missing-formula
  summary: >
    Only the 3-Mirror Projection Attack and 3-Mirror burst case are modeled.
    Alhaitham is a 5-star character, so the 1-Mirror and 2-Mirror Projection
    Attack damage rows and lower-mirror burst instance variants should also be
    represented.
  detail: >
    Add Projection variants for E params 4/5 and 6/7 (2-Mirror has hits: 2).
    Add burst variants for 0/1/2 mirror consumption using Q params 3/4/5 for
    attack instance counts; keep the existing 3-Mirror variant using param 6.

- id: cyno-q-n4-second-hit
  entity: cyno
  rule: S3
  status: actionable
  category: bug
  summary: >
    Pactsworn Pathclearer N4 is modeled as this.param("Q", 4) with hits: 2, but
    the talent row is {param4}+{param5}. The second N4 hit currently uses the
    first hit's multiplier.
  detail: >
    Split the N4 part into two DirectFormula parts using this.param("Q", 4) and
    this.param("Q", 5), or otherwise preserve the two distinct multipliers.

- id: wanderer-c4-hydro-electro-random-buff
  entity: wanderer
  rule: U9
  status: actionable
  category: bug
  summary: >
    C4's extra random untriggered P1 buff is omitted when the team only enables
    Hydro and/or Electro contact. In those cases C4 can still grant an
    untriggered offensive Pyro or Cryo buff, but the implementation grants
    neither.
  detail: >
    Include Hydro/Electro contact when deciding whether C4 should add the best
    missing offensive P1 buff under the peak-damage assumption.
