- id: cyno-p1-dmg-leak
  entity: cyno
  rule: U5
  status: wont-do
  category: engine-gap
  summary: >
    P1 Judication +35% DMG uses filter: { abilities: ["skill"] } which also
    boosts C6 Duststalker Bolts and P1's own 3 bolts. Game text limits the
    +35% to "this Secret Rite: Chasmic Soulfarer" (the Mortuary Rite hit only).
  detail: >
    DamageTagFilter only supports element/ability/reaction dimensions. Both
    Mortuary Rite and Duststalker Bolts share ability:"skill", so there is no
    way to scope the +35% dmg% to Mortuary Rite alone without adding sub-ability
    granularity to the engine. Impact: at C0-C5 there is zero error (P1 bolts
    have no formula entry, and the buff correctly applies to the Mortuary Rite
    in the combo). At C6, the +35% leaks to 5 Duststalker Bolts (100% ATK each).
    With ~96.6% existing Electro DMG bonus (ascension + C2 stacks), the bolt
    over-estimation is ~17.8% relative, but bolts are ~25% of the C6 combo by
    talent mult, yielding ~4.4% total combo error. Within acceptable range
    (under 10%) for a C6-only scenario. Not worth engine complexity.
  created: "2026-02-26"
  resolved: "2026-02-26"
