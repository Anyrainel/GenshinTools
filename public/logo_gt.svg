<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- PINK: Brightest (Top-Left, Left-Top) -->
    <linearGradient id="pinkBright" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FBCFE8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F9A8D4;stop-opacity:1" />
    </linearGradient>

    <!-- PINK: Slightly Darker (Top-Right) -->
    <linearGradient id="pinkDim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E88AB3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D65E92;stop-opacity:1" />
    </linearGradient>

    <!-- BLUE: Brightest (Bottom-Left, Right-Top) -->
    <linearGradient id="blueBright" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22D3EE;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06B6D4;stop-opacity:1" />
    </linearGradient>

    <!-- BLUE: Average (Left-Bottom, Bottom-Right) -->
    <linearGradient id="blueAvg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563EB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1D4ED8;stop-opacity:1" />
    </linearGradient>

    <!-- BLUE: Darkest (Right-Bottom) -->
    <linearGradient id="blueDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E40AF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#172554;stop-opacity:1" />
    </linearGradient>

  </defs>

  <!-- Primogem Star — scaled to fill the canvas -->
  <!-- Tips at 252px from center, valleys at 77px (45°) -->
  <g transform="translate(256, 256)">
    <!-- TOP ARM -->
    <path d="M 0 0 L 0 -252 L -77 -77 Z" fill="url(#pinkBright)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <path d="M 0 0 L 77 -77 L 0 -252 Z" fill="url(#pinkDim)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>

    <!-- LEFT ARM -->
    <path d="M 0 0 L -77 -77 L -252 0 Z" fill="url(#pinkBright)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <path d="M 0 0 L -252 0 L -77 77 Z" fill="url(#blueAvg)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>

    <!-- RIGHT ARM -->
    <path d="M 0 0 L 252 0 L 77 -77 Z" fill="url(#blueBright)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <path d="M 0 0 L 77 77 L 252 0 Z" fill="url(#blueDark)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>

    <!-- BOTTOM ARM -->
    <path d="M 0 0 L -77 77 L 0 252 Z" fill="url(#blueBright)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <path d="M 0 0 L 0 252 L 77 77 Z" fill="url(#blueAvg)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  </g>
</svg>
